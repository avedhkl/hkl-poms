/* Talks to the project's JSON bridge instead of google.script.run, so the interface can live on
   an ordinary web address. Every call is a plain POST with credentials omitted, which is why
   Google answers it even for accounts whose Workspace policy refuses Apps Script *pages*.
   Handlers are held per call chain: the app invokes the function with .apply, so `this` is not
   the runner, and closures are the only safe place to keep them. */
(function () {

  function makeRunner() {
    var ok = null, fail = null;
    var api = {
      withSuccessHandler: function (f) { ok = f; return api; },
      withFailureHandler: function (f) { fail = f; return api; },
      withUserObject: function () { return api; }
    };
    NAMES.forEach(function (name) {
      api[name] = function () {
        var args = Array.prototype.slice.call(arguments);
        var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        window.__apiLog = window.__apiLog || [];
        fetch(API, {
          method: 'POST', credentials: 'omit', cache: 'no-store',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ api: 1, fn: name, args: args })
        }).then(function (r) {
          return r.text().then(function (txt) {
            var j = null;
            try { j = JSON.parse(txt); } catch (e) {}
            return { j: j, txt: txt || '' };
          });
        }).then(function (res) {
          var ms = Math.round(((window.performance && performance.now) ? performance.now() : Date.now()) - t0);
          window.__apiLog.push({ fn: name, ms: ms, ok: !!(res.j && res.j.ok),
                                 err: (res.j && res.j.error) || (res.j ? '' : 'not json: ' + res.txt.slice(0, 60)) });
          if (res.j && res.j.ok) { if (ok) ok(res.j.value); return; }
          var msg = (res.j && res.j.error) || 'The server did not answer.';
          if (fail) fail(new Error(msg));
        }).catch(function (e) {
          (window.__apiLog = window.__apiLog || []).push({ fn: name, ms: -1, ok: false, err: 'threw: ' + (e && e.message) });
          if (fail) fail(e);
        });
        return api;
      };
    });
    return api;
  }
  window.google = window.google || {};
  google.script = google.script || {};
  Object.defineProperty(google.script, 'run', { get: makeRunner, configurable: true });

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Styles.html - the ETD HKL design tokens and shared components. Do not restyle:
     cool gray-white + ink blue + silky sage, Zilla Slab / IBM Plex Sans / IBM Plex Mono. -->
<style>
    /* same palette and components as the rest of the ETD HKL tools - do not restyle */
    :root{--ink:#F8FAFC;--panel:#FFFFFF;--panel-2:#F1F5F9;--panel-3:#E8EEF4;--line:#D5DEE7;
          --line-soft:#E3E9EF;--paper:#0F172A;--paper-dim:#334155;--muted:#64748B;
          --accent:#2F6A60;--accent-ink:#FFFFFF;--good:#15803D;--good-dim:#DCFCE7;
          --warn:#B45309;--warn-dim:#FEF3C7;--info:#1D4ED8;--info-dim:#DBEAFE;
          --danger:#B91C1C;--danger-dim:#FEE2E2;--radius:5px;}
    *{box-sizing:border-box;} html,body{margin:0;padding:0;}
    body{background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',sans-serif;
         font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    .mono{font-family:'IBM Plex Mono',monospace;}
    h1,h2,h3{font-family:'Zilla Slab',serif;margin:0;}
    .wrap{max-width:100%;margin:0;padding:22px clamp(14px, 1.5cm, 46px) 96px;}
    @media (min-width:1100px){ .wrap{padding-left:2cm;padding-right:2cm;} }
    /* a wheel while something is loading, and a thin bar across the top */
    .who-left{display:flex;align-items:center;gap:14px;}
    .avatar{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--line);
      background:var(--panel-3);flex:0 0 auto;}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    .avatar.big{width:104px;height:104px;}
    .facts{font-size:12.5px;color:var(--muted);margin-top:3px;}
    .photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
    #stuBusy{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;
      display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
      border-radius:999px;padding:9px 16px;font-size:12.5px;color:var(--paper);box-shadow:0 6px 22px rgba(15,23,42,.12);}
    .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--panel-3);
      border-top-color:var(--accent);animation:sp .7s linear infinite;flex:0 0 auto;}
    @keyframes sp{to{transform:rotate(360deg);}}
    #stuBar{position:fixed;top:0;left:0;height:3px;width:0;z-index:61;background:var(--accent);
      transition:width .25s ease;box-shadow:0 1px 6px rgba(47,106,96,.35);}
    #stuBar.on{animation:sweep 1.6s ease-in-out infinite;}
    @keyframes sweep{0%{width:8%;margin-left:0}50%{width:55%;margin-left:20%}100%{width:8%;margin-left:92%}}
    .skel{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;
      animation:shim 1.2s linear infinite;border-radius:4px;height:11px;margin:9px 0;}
    @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .header{margin-bottom:26px;}
    .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
    .header h1{font-size:26px;font-weight:600;margin:6px 0 4px;}
    .header .sub{color:var(--muted);font-size:13px;}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
           padding:20px 22px;margin-bottom:18px;width:100%;}
     /* one wrapper per field, so a wide screen can lay them out side by side */
     .field{min-width:0;}
     .field > label{margin-top:0;}
     @media (min-width:900px) {
       #formStudent, #formSupervisor{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;align-items:start;}
       #formStudent > .btn, #formSupervisor > .btn{grid-column:1 / -1;justify-self:start;margin-top:0;}
       #formStudent > .note, #formSupervisor > .note{grid-column:1 / -1;}
     }
     @media (min-width:1400px) {
       #formStudent, #formSupervisor{grid-template-columns:1fr 1fr 1fr;}
       #formAdmin{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;align-items:start;}
       #formAdmin > .btn{grid-column:1 / -1;justify-self:start;margin-top:0;}
     }
     @media (max-width:560px) {
       .wrap{padding:14px 14px 80px;}
       .card{padding:16px 14px;}
       .profile-grid{grid-template-columns:1fr;}
     }

    .tabs{display:flex;gap:8px;margin-bottom:18px;}
    .tab-btn{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--paper-dim);
             padding:10px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;
             font-weight:600;text-align:center;font-family:inherit;}
    .tab-btn.on{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}
    label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;
          letter-spacing:.04em;margin:12px 0 5px;}
    label:first-child{margin-top:0;}
    input,select{width:100%;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);
                 padding:9px 11px;border-radius:4px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;}
    input:focus,select:focus{outline:none;border-color:var(--accent);}
    .btn{display:inline-block;background:var(--accent);color:#FFFFFF;border:none;padding:10px 18px;
         border-radius:4px;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:14px;
         font-family:inherit;}
    .btn:hover{filter:brightness(1.08);}
    .btn.secondary{background:var(--panel-3);color:var(--paper-dim);border:1px solid var(--line);}
    .btn.small{padding:7px 12px;font-size:12px;margin-top:0;}
    .err{color:var(--danger);font-size:12.5px;margin-top:8px;}
    .hidden{display:none !important;}
    .who-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
             flex-wrap:wrap;margin-bottom:18px;}
    .who-bar .name{font-weight:600;}
    .who-bar .role{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}
    .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:6px;}
    .pf{font-size:13px;}
    .pf .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
           display:block;margin-bottom:2px;}
    .pf .v{font-weight:600;color:var(--paper);}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;
       letter-spacing:.04em;border-bottom:1px solid var(--line);padding:8px 8px;}
    td{border-bottom:1px solid var(--line-soft);padding:10px 8px;font-size:13px;}
    tr:last-child td{border-bottom:none;}
    .badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;
           padding:3px 9px;border-radius:999px;text-transform:uppercase;}
    .badge.good{background:var(--good-dim);color:var(--good);}
    .badge.info{background:var(--info-dim);color:var(--info);}
    .badge.warn{background:var(--warn-dim);color:var(--warn);}
    .badge.muted{background:var(--panel-3);color:var(--paper-dim);}
    .note{color:var(--muted);font-size:12px;margin-top:14px;}
    /* name type-ahead */
    .sugg{position:relative;}
    .sugg ul{position:absolute;z-index:20;left:0;right:0;top:100%;margin:2px 0 0;padding:0;
             list-style:none;background:var(--panel-2);border:1px solid var(--line);
             border-radius:4px;box-shadow:0 10px 24px rgba(15,23,42,.14);max-height:250px;
             overflow-y:auto;display:none;}
    .sugg ul.on{display:block;}
    .sugg li{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
    .sugg li:last-child{border-bottom:none;}
    .sugg li:hover,.sugg li.sel{background:var(--panel-3);}
    .sugg li b{color:var(--accent);}
    .sugg .none,.sugg .more{color:var(--muted);font-size:12.5px;cursor:default;}
    .diag{color:var(--muted);font-size:11.5px;margin-top:12px;font-family:'IBM Plex Mono',monospace;}
  
</style>

</head>
<body>
<div class="wrap">
<!-- PulseHero.html - the animated strip that tops every ETD HKL screen.
     Motion is decoration only and stops completely when the reader asks for reduced motion. -->
<div class="pulse-hero" aria-hidden="true">
  <svg viewBox="0 0 600 40" preserveAspectRatio="none">
    <defs>
      <linearGradient id="phGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1D4ED8"/>
        <stop offset="55%" stop-color="#2F6A60"/>
        <stop offset="100%" stop-color="#B91C1C"/>
      </linearGradient>
    </defs>
    <path class="ph-track" d="M0 22 H600" fill="none" stroke="#D5DEE7" stroke-width="1"/>
    <path class="ph-line"
          d="M0 22 H110 l10 -10 l9 20 l10 -20 l9 20 l10 -10 H290 l10 -10 l9 20 l10 -20 l9 20 l10 -10 H600"
          fill="none" stroke="url(#phGrad)" stroke-width="2" stroke-linejoin="round"/>
  </svg>
</div>
<style>
  .pulse-hero{height:34px;margin:-4px 0 14px;overflow:hidden;}
  .pulse-hero svg{width:100%;height:34px;display:block;}
  .ph-track{opacity:.8;}
  .ph-line{stroke-dasharray:90 620;animation:phSweep 7s linear infinite;}
  @keyframes phSweep{from{stroke-dashoffset:710;}to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion: reduce){.ph-line{animation:none;stroke-dasharray:none;opacity:.75;}}
</style>



  <!-- ------------------------------------------------------------ sign in -->
  <div id="loginView">
    <div class="header">
      <div class="eyebrow">Emergency &amp; Trauma Department · Hospital Kuala Lumpur</div>
      <h1>HKL Postgraduate Monitoring System (HKL-PoMS)</h1>
      <div class="sub">Sign in to view your record.</div>
    </div>

    <div class="card">
      <div id="gmailLine" class="note" style="margin-bottom:10px"></div>
    <div class="tabs">
        <button class="tab-btn on" id="tStudent" data-act="pick" data-arg="Student">Student</button>
        <button class="tab-btn" id="tSupervisor" data-act="pick" data-arg="Supervisor">Supervisor</button>
        <button class="tab-btn" id="tAdmin" data-act="pick" data-arg="Admin">Admin</button>
      </div>

      <div id="formStudent">
        <div class="field">
          <label>Your name</label>
          <div class="sugg">
            <input id="stuName" type="text" autocomplete="off" placeholder="Start typing your name"
                   oninput="suggest('stu')" onfocus="suggest('stu')" onblur="closeSugg('stu')"
                   onkeydown="enterKey_(event, 'Student')">
            <ul id="stuList"></ul>
          </div>
        </div>
        <div class="field">
          <label>Registered email</label>
          <input id="stuEmail" type="email" placeholder="the email the department holds for you"
                   onkeydown="enterKey_(event, 'Student')">
        </div>
        <button class="btn" id="stuBtn" data-act="doStudent">Sign in</button>
      </div>

      <div id="formSupervisor" class="hidden">
        <div class="field">
          <label>Your name</label>
          <div class="sugg">
            <input id="supName" type="text" autocomplete="off" placeholder="Start typing your name"
                   oninput="suggest('sup')" onfocus="suggest('sup')" onblur="closeSugg('sup')"
                   onkeydown="enterKey_(event, 'Supervisor')">
            <ul id="supList"></ul>
          </div>
        </div>
        <div class="field">
          <label>NSR number</label>
          <input id="supPin" type="password" placeholder="Your 6-digit NSR number"
                   onkeydown="enterKey_(event, 'Supervisor')">
        </div>
        <div class="note" style="margin-top:6px">Use the NSR number we hold for you. Ask the
          department admin if you are not sure what it is.</div>
        <button class="btn" id="supBtn" data-act="doSupervisor">Sign in</button>
      </div>

      <div id="formAdmin" class="hidden">
        <div class="field">
          <label>Admin passcode</label>
          <input id="admPass" type="password" placeholder="Passcode"
                   onkeydown="enterKey_(event, 'Admin')">
        </div>
        <button class="btn" id="admBtn" data-act="doAdmin">Sign in</button>
      </div>

      <div class="err hidden" id="loginErr"></div>
    </div>
  </div>

  <!-- --------------------------------------------------------- dashboards -->
  <div id="appView" class="hidden">
    <div class="who-bar">
      <div class="who-left">
        <div class="avatar" id="whoPhoto" hidden></div>
        <div>
          <div class="name" id="whoName">&nbsp;</div>
          <div class="role" id="whoRole"></div>
          <div class="facts" id="whoFacts"></div>
        </div>
      </div>
      <button class="btn secondary small" data-act="signOut">Log out</button>
    </div>
    <div class="err hidden" id="appErr"></div>

    <div id="viewStudent" class="hidden">
      <!-- ============================================================================
     Student.html - the student portal. Hash-routed, phone-first, no page reloads.
     Every value that reaches the screen goes through esc(); no inline event handlers.
     ============================================================================ -->
<style>
  .spa-nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;}
  .spa-nav button{background:var(--panel-2);border:1px solid var(--line);color:var(--paper-dim);
    padding:8px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;
    font-family:inherit;white-space:nowrap;}
  .spa-nav button.on{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}
  .spa-nav button .n{background:var(--danger);color:#fff;border-radius:999px;font-size:10px;
    padding:1px 6px;margin-left:6px;}
  @media (max-width:640px){
    .spa-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;flex-wrap:nowrap;overflow-x:auto;margin:0;}
    .spa-nav button{flex:1 1 0;min-width:0;font-size:9.5px;padding:7px 3px;border:none;background:none;
      text-align:center;overflow:hidden;text-overflow:ellipsis;}
    .spa-nav button.on{background:var(--panel-3);color:var(--accent);}
    .spa-wrap{padding-bottom:76px !important;}
  }
  .sec{margin-bottom:18px;}
  .sec h3{font-size:14px;margin-bottom:8px;color:var(--paper);}
  .att{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:4px;
    background:var(--panel-2);border:1px solid var(--line);margin-bottom:7px;font-size:13px;}
  .att.high{border-left:3px solid var(--danger);}
  .att.warn{border-left:3px solid var(--warn);}
  .att.info{border-left:3px solid var(--info);}
  .rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
  .ring{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:12px;
    text-align:center;}
  .ring .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    margin-top:6px;}
  .ring .sub{font-size:11.5px;color:var(--paper-dim);}
  .tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:16px;}
  .tl-item{position:relative;padding:10px 0 14px;}
  .tl-item:before{content:'';position:absolute;left:-23px;top:15px;width:9px;height:9px;
    border-radius:50%;background:var(--line);}
  .tl-item.ok:before{background:var(--good);}
  .tl-item.now:before{background:var(--accent);}
  .tl-item.bad:before{background:var(--danger);}
  .tl-h{font-weight:600;font-size:13.5px;}
  .tl-m{color:var(--muted);font-size:12px;margin-top:2px;}
  .bar{height:7px;background:var(--panel-3);border-radius:999px;overflow:hidden;margin:7px 0;}
  .bar > i{display:block;height:100%;background:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:12px;}
  .cal .dow{color:var(--muted);font-size:10px;text-align:center;text-transform:uppercase;}
  .cal .d{min-height:44px;background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:3px;padding:4px;position:relative;}
  .cal .d.weekend{opacity:.55;}
  .cal .d.hol{background:var(--info-dim);border-color:var(--info);}
  .cal .d.lv{background:var(--warn-dim);border-color:var(--accent);}
  .cal .d .n{font-size:10.5px;color:var(--muted);}
  .cal .d .tag{font-size:9px;display:block;color:var(--paper);overflow:hidden;white-space:nowrap;}
  .modal-bg{position:fixed;inset:0;background:rgba(6,11,15,.72);z-index:60;display:flex;
    align-items:center;justify-content:center;padding:18px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:620px;
    width:100%;max-height:86vh;overflow:auto;padding:20px 22px;}
  .modal h3{margin-bottom:12px;font-size:16px;}
  .toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  @media (max-width:640px){.toasts{left:12px;right:12px;bottom:78px;}}
  .toast{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:4px;padding:10px 13px;font-size:13px;box-shadow:0 8px 22px rgba(15,23,42,.12);}
  .toast.bad{border-left-color:var(--danger);}
  .toast.good{border-left-color:var(--good);}
  .skel{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));
    border-radius:4px;height:14px;margin:8px 0;animation:sk 1.2s ease-in-out infinite;}
  @keyframes sk{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
  @media (prefers-reduced-motion: reduce){.skel{animation:none;}}
  .k-v{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .k-v .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .k-v .v{font-weight:600;font-size:13.5px;}

</style>

  <div class="spa-nav" id="stuNav"></div>

  <div id="v-home" class="spa-view"></div>
  <div id="v-postings" class="spa-view hidden"></div>

  <div id="v-leave" class="spa-view hidden"></div>
  <div id="v-meetings" class="spa-view hidden"></div>
  <div id="v-documents" class="spa-view hidden"></div>
  <div id="v-checklist" class="spa-view hidden"></div>

</div>

<div class="toasts" id="stuToasts"></div>
<div id="stuModal"></div>

<script>
/* ------------------------------------------------------------------ helpers */
var STU = { route: 'home', data: {}, leaveMonth: null, unread: 0 };

function stuSkeleton(id) {
  var box = document.getElementById(id);
  if (box) box.innerHTML = '<div class="card"><div class="skel" style="width:40%"></div>' +
    '<div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></div>';
}

function toast(msg, kind) {
  var box = document.getElementById('stuToasts');
  if (!box) return;
  var d = document.createElement('div');
  d.className = 'toast' + (kind ? ' ' + kind : '');
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, kind === 'bad' ? 7000 : 4200);
}

function modal(title, bodyHtml, buttons) {
  var host = document.getElementById('stuModal');
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<h3>' + esc(title) + '</h3>' + bodyHtml +
    '<div class="row-actions" id="mActs"></div>';
  bg.appendChild(m);
  host.appendChild(bg);
  bg.setAttribute('data-bg', '1');
  (buttons || []).forEach(function (b, i) {
    var el2 = document.createElement('button');
    el2.className = 'btn' + (b.secondary ? ' secondary' : '') + ' small';
    el2.textContent = b.label;
    el2.setAttribute('data-idx', String(i));
    el2.addEventListener('click', function () { b.onClick ? b.onClick() : stuCloseModal(); });
    m.querySelector('#mActs').appendChild(el2);
  });
  if (!buttons || !buttons.length) {
    var c = document.createElement('button');
    c.className = 'btn small secondary'; c.textContent = 'Close';
    c.addEventListener('click', stuCloseModal);
    m.querySelector('#mActs').appendChild(c);
  }
  return m;
}

function stuCloseModal() {
  document.querySelectorAll('.modal-bg').forEach(function (b) { b.remove(); });
}

function ring(pct, label, sub) {
  var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
  var r = 22, c = 2 * Math.PI * r, off = c - (p / 100) * c;
  var stroke = p >= 80 ? '#15803D' : (p >= 40 ? '#B45309' : '#B91C1C');
  return '<div class="ring"><svg width="58" height="58" viewBox="0 0 58 58" role="img" aria-label="' +
    p + ' percent">' +
    '<circle cx="29" cy="29" r="' + r + '" fill="none" stroke="#E8EEF4" stroke-width="6"></circle>' +
    '<circle cx="29" cy="29" r="' + r + '" fill="none" stroke="' + stroke + '" stroke-width="6" ' +
    'stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) +
    '" transform="rotate(-90 29 29)"></circle>' +
    '<text x="29" y="33" text-anchor="middle" fill="#0F172A" font-size="14" font-family="IBM Plex Mono, monospace">' +
    p + '%</text></svg><div class="lab">' + esc(label) + '</div><div class="sub">' + esc(sub || '') + '</div></div>';
}

function dfmt(s) {
  if (!s) return '—';
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(s);
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return Number(m[3]) + ' ' + months[Number(m[2]) - 1] + ' ' + m[1];
}

/** A readable label for the loading wheel. */
/** The line under the name: supervisor, programme start, expected finish. */
function whoLine_(s) {
  if (!s) return '';
  var bits = [];
  if (s.supervisor) bits.push('Supervisor: ' + s.supervisor);
  if (s.tarikhLaporDiri) bits.push('Started ' + dfmt(s.tarikhLaporDiri));
  var end = s.expectedGraduation || s.tarikhTamatJabatan;
  if (end) bits.push('Expected to finish ' + dfmt(end));
  return bits.join('  \u00b7  ');
}

/** Paints (or clears) the picture and the facts in the header bar. */
function setWhoBar_(student, photoDataUrl) {
  var f = document.getElementById('whoFacts');
  if (f) f.textContent = whoLine_(student);
  var a = document.getElementById('whoPhoto');
  if (!a) return;
  if (photoDataUrl) { a.innerHTML = '<img alt="" src="' + photoDataUrl + '">'; a.hidden = false; }
  else { a.innerHTML = ''; a.hidden = true; }
}

/** Shrink a chosen picture in the browser, so what reaches the sheet stays small. */
function shrinkPhoto_(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var max = 320, w = img.width, h = img.height;
      if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
      else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = function () { cb(''); };
    img.src = e.target.result;
  };
  reader.onerror = function () { cb(''); };
  reader.readAsDataURL(file);
}

function labelFor_(fn) {
  var L = {
    stuHome: 'Loading your home\u2026', stuPostings: 'Loading your postings\u2026',
    stuDissertation: 'Loading your dissertation\u2026', stuLeave: 'Loading your leave\u2026',
    stuLeaveCalendar: 'Loading the calendar\u2026', stuMeetings: 'Loading meetings\u2026',
    stuDocuments: 'Loading documents\u2026', stuChecklist: 'Loading your checklist\u2026',
    stuNotifications: 'Loading your inbox\u2026', stuProfile: 'Loading your profile\u2026',
    supCohort: 'Loading your students\u2026', supApprovals: 'Loading the queue\u2026',
    supMeetings: 'Loading meetings\u2026', supLeaveCalendar: 'Loading the team calendar\u2026',
    supExport: 'Building the file\u2026',
    adminDashboard: 'Loading the dashboard\u2026', adminStudents: 'Loading students\u2026',
    adminPlanner: 'Loading the rotation\u2026', adminLeave: 'Loading leave\u2026',
    adminDissertation: 'Loading dissertation stages\u2026', adminSupervisors: 'Loading supervisors\u2026',
    adminUsers: 'Loading accounts\u2026', adminSettings: 'Loading settings\u2026',
    adminAnnouncements: 'Loading notices\u2026', adminAudit: 'Loading the audit log\u2026',
    adminCohortReport: 'Building the report\u2026', adminStudentFile: 'Loading the student file\u2026'
  };
  return L[fn] || 'Loading\u2026';
}

/**
 * Warms the other screens in the background, one at a time, so a click on any of them is
 * already answered from the server's cache instead of being built from scratch.
 */
var WARMED = {};
function prefetchAll(list, gap) {
  var i = 0;
  function next() {
    if (i >= list.length) return;
    var spec = list[i++];
    var fn = spec[0], args = spec[1] || [];
    if (WARMED[fn]) { next(); return; }
    WARMED[fn] = 1;
    var go = function () { setTimeout(next, gap || 180); };
    try { google.script.run.withSuccessHandler(go).withFailureHandler(go)[fn].apply(null, args); }
    catch (e) { go(); }
  }
  setTimeout(next, 600);
}

function stuRun(fn, args, ok, bad) {
  stuBusy(true, labelFor_(fn));
  google.script.run
    .withSuccessHandler(function (r) {
      stuBusy(false);
      if (r === null || r === undefined) {
        try { google.script.run.clientLog('view ' + STU.route + ' <- ' + fn + ' : ' + describe_(r), 'rpc'); } catch (e) {}
      }
      try {
        ok(r);
      } catch (e) {
        var host = document.getElementById('v-' + STU.route);
        if (host) {
          host.innerHTML = card_('This screen could not be drawn',
            esc(String(e.message || e)) + '<div class="note">Please tell the admin this screen and what you were doing.</div>');
        }
        try { google.script.run.clientLog('render ' + STU.route + ' threw: ' + (e.message || e), 'render'); } catch (e2) {}
      }
    })
    .withFailureHandler(function (e) {
      stuBusy(false);
      var msg = fail(e);
      if (bad) bad(msg); else toast(msg, 'bad');
    })
    [fn].apply(null, args || []);
}

/** The loading wheel. Counts overlapping calls, so it goes when the last one lands. */
var BUSY = 0;
function stuBusy(on, what) {
  BUSY = on ? BUSY + 1 : Math.max(0, BUSY - 1);
  var b = document.getElementById('stuBusy');
  var bar = document.getElementById('stuBar');
  if (BUSY > 0) {
    if (!b) {
      b = document.createElement('div');
      b.id = 'stuBusy';
      b.innerHTML = '<span class="spin"></span><span id="stuBusyText">Loading\u2026</span>';
      document.body.appendChild(b);
    }
    var t = document.getElementById('stuBusyText');
    if (t && what) t.textContent = what;
    if (!bar) { bar = document.createElement('div'); bar.id = 'stuBar'; document.body.appendChild(bar); }
    bar.className = 'on';
  } else {
    if (b) b.remove();
    if (bar) { bar.className = ''; bar.style.width = '0'; }
  }
}

/* ------------------------------------------------------------------- routes */
var ROUTES = [['home', 'Home'], ['postings', 'Postings'], ['dissertation', 'Dissertation'],
              ['leave', 'Leave'], ['meetings', 'Meetings'], ['documents', 'Documents'],
              ['checklist', 'Pass checklist'], ['profile', 'Profile'], ['inbox', 'Inbox']];

function stuEnter() {
  var spa = document.getElementById('stuSpa');
  if (spa) spa.className = 'spa-wrap';
  stuNavRender();
  stuGo(location.hash.replace('#/', '') || 'home');
}

function stuNavRender() {
  var nav = document.getElementById('stuNav');
  if (!nav) return;
  nav.innerHTML = ROUTES.map(function (r) {
    return '<button data-stu="' + r[0] + '" class="' + (STU.route === r[0] ? 'on' : '') + '">' +
      esc(r[1]) + (r[0] === 'inbox' && STU.unread ? '<span class="n">' + STU.unread + '</span>' : '') + '</button>';
  }).join('');
}

function stuGo(route) {
  if (!ROUTES.some(function (r) { return r[0] === route; })) route = 'home';
  STU.route = route;
  if (location.hash !== '#/' + route) location.hash = '#/' + route;
  document.querySelectorAll('.spa-view').forEach(function (v) { v.className = 'spa-view hidden'; });
  var view = document.getElementById('v-' + route);
  if (view) view.className = 'spa-view';
  stuNavRender();
  stuSkeleton('v-' + route);
  ({ home: stuRenderHome, postings: stuRenderPostings, dissertation: stuRenderDissertation,
     leave: stuRenderLeave, meetings: stuRenderMeetings, documents: stuRenderDocuments,
     checklist: stuRenderChecklist, profile: stuRenderProfile, inbox: stuRenderInbox }[route])();
}

document.addEventListener('click', function (ev) {
  var n = ev.target.closest ? ev.target.closest('[data-stu]') : null;
  if (n) { ev.preventDefault(); stuGo(n.getAttribute('data-stu')); return; }
  var a = ev.target.closest ? ev.target.closest('[data-sact]') : null;
  if (!a) return;
  ev.preventDefault();
  var id = a.getAttribute('data-sid') || '';
  var acts = {
    savePhoto: stuSavePhotoAct, removePhoto: stuRemovePhotoAct,
    postingDone: stuPostingDone, milestoneSubmit: stuMilestoneSubmit, milestoneDate: stuMilestoneDate,
    extension: stuExtension, leaveForm: stuLeaveForm, leavePreview: stuLeavePreview,
    leaveCancel: stuLeaveCancel, meetingForm: stuMeetingForm, docForm: stuDocForm,
    docUpload: stuDocUpload, comment: stuCommentForm, readNotif: stuReadNotif,
    calPrev: function () { stuShiftMonth(-1); }, calNext: function () { stuShiftMonth(1); },
    profileEdit: stuProfileEdit, altEmail: stuAltEmail, addComment: stuAddCommentModal
  };
  if (acts[a.getAttribute('data-sact')]) acts[a.getAttribute('data-sact')](id);
});

window.addEventListener('hashchange', function () {
  var r = location.hash.replace('#/', '') || 'home';
  if (r !== STU.route) stuGo(r);
});

/* --------------------------------------------------------------- S1 home */
function stuRenderHome() {
  stuRun('stuHome', [TOKEN], function (d) {
    if (!d || d.error || !d.rings || !d.leave) { document.getElementById('v-' + STU.route).innerHTML = card_('Home', esc(reason_(d))); return; }
    STU.data.home = d;
    setWhoBar_(d.student, null);
    stuRun('stuPhoto', [TOKEN], function (p) { setWhoBar_(d.student, p && p.dataUrl ? p.dataUrl : null); });
    var att = (d.attention || []).map(function (a) {
      return '<div class="att ' + esc(a.severity) + '"><div>' + esc(a.text) + '</div></div>';
    }).join('') || '<div class="note">Nothing needs your attention right now.</div>';

    var r = d.rings;
    var rings = '<div class="rings">' +
      ring(r.dissertation.pct, 'Dissertation', r.dissertation.done + ' of ' + r.dissertation.total + ' verified') +
      ring(r.postings.pct, 'Postings', r.postings.done + ' of ' + r.postings.total + ' completed') +
      ring(r.readiness.pct, 'Pass readiness', r.readiness.done + ' of ' + r.readiness.total + ' met') +
      ring(r.meetings.pct, 'Meetings', r.meetings.done + ' of ' + r.meetings.total + ' this semester') +
      '</div>';

    var bal = (d.leave.balances || []).map(function (b) {
      var right = (!b.entitlement && b.entitlement !== 0)
        ? (b.used ? esc(b.used + ' day(s) recorded') : 'no limit set')
        : esc(b.remaining + ' of ' + b.entitlement + ' left');
      return '<div class="k-v"><div><div class="k">' + esc(b.type) + '</div><div class="v">' + right +
             (b.pending ? ' <span class="badge warn">' + esc(b.pending) + ' pending</span>' : '') + '</div></div></div>';
    }).join('');

    var np = d.nextPosting;
    var next = np ? ('<div class="k-v"><div><div class="k">Next posting</div><div class="v">' +
        esc(np['tempat'] || '—') + '</div></div><div><div class="k">Starts</div><div class="v">' +
        dfmt(np['startDate']) + '</div></div><div><div class="k">Ends</div><div class="v">' +
        dfmt(np['endDate']) + '</div></div></div>') :
      '<div class="note">No future posting is recorded. Ask the admin to add one.</div>';

    var ann = (d.announcements || []).map(function (a) {
      return '<div class="att info"><div><b>' + esc(a.title) + '</b><div class="note">' + esc(a.body || '') + '</div></div></div>';
    }).join('') || '<div class="note">No announcements.</div>';

    document.getElementById('v-home').innerHTML =
      card_('Needs your attention', att) +
      card_('Progress', rings) +
      '<div class="grid2">' + card_('Leave balance ' + esc(d.leave.year), bal || '<div class="note">No leave types configured.</div>') +
      card_('Next posting', next) + '</div>' +
      card_('Announcements', ann);
  });
}

/* A dead end must say what came back, not just "could not load". */
function reason_(d) {
  if (d === null) return 'The server returned nothing for this screen.';
  if (d === undefined) return 'No answer came back from the server.';
  if (d && d.error) return 'Error: ' + d.error;
  try { return 'Unexpected answer: ' + JSON.stringify(d).slice(0, 220); } catch (e) { return 'Unexpected answer.'; }
}

/* What arrived, in words, for the log. */
function describe_(r) {
  if (r === null) return 'NULL';
  if (r === undefined) return 'undefined';
  var kind = typeof r;
  if (kind !== 'object') return kind + ' ' + String(r).slice(0, 40);
  if (Array.isArray(r)) return 'array of ' + r.length;
  return 'object keys=' + Object.keys(r).join(',');
}

function card_(title, body) {
  return '<div class="card"><div class="sec"><h3>' + esc(title) + '</h3>' + body + '</div></div>';
}

/* ------------------------------------------------------------ S3 postings */
function stuRenderPostings() {
  stuRun('stuPostings', [TOKEN], function (d) {
    if (!d || d.error || !d.postings) { document.getElementById('v-' + STU.route).innerHTML = card_('Postings', esc(reason_(d))); return; }
    STU.data.postings = d;
    var items = (d.postings || []).map(function (p) {
      var cls = String(p.status) === 'Completed' ? 'ok' : (String(p.status) === 'Pending Verification' ? 'now' : '');
      var says = { Completed: 'Verified and closed', 'Pending Verification': 'Waiting for your supervisor to verify' };
      var note = says[String(p.status)] || ('Status: ' + String(p.status || 'Active'));
      var tail = '';
      if (p.status === 'Pending Verification') tail = '<div class="row-actions"><button class="btn small secondary" data-sact="comment" data-sid="' + esc(p.id) + '">Add a note</button></div>';
      else tail = '<div class="row-actions"><button class="btn small" data-sact="postingDone" data-sid="' + esc(p.id) + '">Mark completed</button>' +
                  '<button class="btn small secondary" data-sact="extension" data-sid="' + esc(p.roundNo) + '">Request extension</button></div>';
      return '<div class="tl-item ' + cls + '"><div class="tl-h">' + esc(p.tempat || 'Posting ' + p.roundNo) + '</div>' +
        '<div class="tl-m">' + dfmt(p.startDate) + ' → ' + dfmt(p.endDate) +
        (p.daysLeft !== null && p.daysLeft >= 0 ? ' · ' + esc(p.daysLeft) + ' day(s) left' : '') + '</div>' +
        '<div class="tl-m">' + esc(note) + (p.evaluationUrl ? ' · <a href="' + esc(p.evaluationUrl) + '" target="_blank" rel="noopener">document</a>' : '') + '</div>' +
        (p.studentNote ? '<div class="note">' + esc(p.studentNote) + '</div>' : '') + tail + '</div>';
    }).join('') || '<div class="note">No postings recorded yet.</div>';

    var exts = (d.extensions || []).map(function (x) {
      return '<div class="att ' + (String(x.status) === 'Approved' ? 'info' : 'warn') + '"><div>' +
        '<b>Round ' + esc(x.roundNo) + '</b> · ' + esc(x.status) + '<div class="note">' + esc(x.reason || '') +
        '<br>' + dfmt(x.startDate) + ' → ' + dfmt(x.endDate) +
        (x.decisionNote ? '<br>Supervisor: ' + esc(x.decisionNote) : '') + '</div></div></div>';
    }).join('') || '<div class="note">No extension requests.</div>';

    document.getElementById('v-postings').innerHTML =
      card_('My postings (rotation rounds)', '<div class="tl">' + items + '</div>') +
      card_('Extension requests', exts);
  });
}

function stuPostingDone(id) {
  modal('Mark this posting completed', '<div class="note">Say what you did and paste a link to your evaluation or logbook if you have one. Your supervisor is asked to verify it.</div>' +
    '<label for="pdNote">What you completed</label><textarea id="pdNote" rows="3" style="width:100%;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px"></textarea>' +
    '<label for="pdLink">Evaluation or logbook link (optional)</label><input id="pdLink" type="url" placeholder="https://">',
    [{ label: 'Send for verification', onClick: function () {
        var note = document.getElementById('pdNote').value, link = document.getElementById('pdLink').value;
        stuRun('stuCompletePosting', [TOKEN, id, note, link], function (r) {
          if (r && r.error) { toast(r.error, 'bad'); return; }
          stuCloseModal(); toast('Sent to your supervisor to verify.', 'good'); stuGo('postings');
        });
      } }, { label: 'Cancel', secondary: true }]);
}

function stuExtension(roundNo) {
  modal('Request an extension', '<div class="note">Give the dates you would need and why.</div>' +
    '<div class="grid2"><div><label for="exFrom">From</label><input id="exFrom" type="date"></div>' +
    '<div><label for="exTo">To</label><input id="exTo" type="date"></div></div>' +
    '<label for="exWhy">Reason</label><textarea id="exWhy" rows="3" style="width:100%;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px"></textarea>',
    [{ label: 'Send to supervisor', onClick: function () {
        stuRun('stuRequestExtension', [TOKEN, roundNo, document.getElementById('exWhy').value,
          document.getElementById('exFrom').value, document.getElementById('exTo').value], function (r) {
          if (r && r.error) { toast(r.error, 'bad'); return; }
          stuCloseModal(); toast('Extension request sent.', 'good'); stuGo('postings');
        });
      } }, { label: 'Cancel', secondary: true }]);
}

/* -------------------------------------------------------- S4 dissertation */
function stuRenderDissertation() {
  stuRun('stuDissertation', [TOKEN], function (d) {
    if (!d || d.error || !d.milestones || !d.progress) { document.getElementById('v-' + STU.route).innerHTML = card_('Dissertation', esc(reason_(d))); return; }
    STU.data.diss = d;
    var items = (d.milestones || []).map(function (m) {
      var cls = String(m.status) === 'Verified' ? 'ok' : (String(m.status) === 'Revision requested' ? 'bad' : '');
      var acts2 = '';
      if (String(m.status) !== 'Verified') {
        acts2 = '<div class="row-actions">' +
          '<button class="btn small" data-sact="milestoneSubmit" data-sid="' + esc(m.id) + '">Submit for verification</button>' +
          '<button class="btn small secondary" data-sact="milestoneDate" data-sid="' + esc(m.id) + '">Propose target date</button>' +
          '<button class="btn small secondary" data-sact="addComment" data-sid="' + esc(m.id) + '">Comment</button></div>';
      }
      var cs = (d.comments || []).filter(function (c) { return String(c.entityId) === String(m.id); })
        .map(function (c) { return '<div class="tl-m">' + esc(c.who) + ': ' + esc(c.text) + '</div>'; }).join('');
      return '<div class="tl-item ' + cls + '"><div class="tl-h">' + esc(m.milestone) + '</div>' +
        '<div class="tl-m">' + esc(m.status) + ' · target ' + dfmt(m.targetDate || m.proposedTargetDate) +
        (m.weight ? ' · weight ' + esc(m.weight) + '%' : '') + '</div>' +
        (m.progressNote ? '<div class="note">' + esc(m.progressNote) + '</div>' : '') +
        (m.supervisorNote ? '<div class="note">Supervisor: ' + esc(m.supervisorNote) + '</div>' : '') + cs + acts2 + '</div>';
    }).join('') || '<div class="note">No milestones.</div>';

    document.getElementById('v-dissertation').innerHTML =
      card_('Overall progress', ring(d.progress.weightedPct, 'Weighted completion',
           d.progress.verified + ' of ' + d.progress.total + ' verified') +
           (d.next ? '<div class="note">Next up: <b>' + esc(d.next.milestone) + '</b></div>' : '')) +
      card_('Milestones', '<div class="tl">' + items + '</div>');
  });
}

/* ----------------------------------------------------------------- S5 leave */
function stuRenderLeave() {
  stuRun('stuLeave', [TOKEN], function (d) {
    if (!d || d.error || !d.balances) { document.getElementById('v-' + STU.route).innerHTML = card_('Leave', esc(reason_(d))); return; }
    STU.data.leave = d;
    if (!STU.leaveMonth) {
      var n = new Date();
      STU.leaveMonth = n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2);
    }
    var bal = (d.balances.balances || []).map(function (b) {
      return '<div class="att"><div><b>' + esc(b.type) + '</b><div class="note">' +
        ((!b.entitlement && b.entitlement !== 0) ? 'No limit set for this type'
          : esc(b.remaining) + ' of ' + esc(b.entitlement) + ' remaining') +
        (b.pending ? ' · ' + esc(b.pending) + ' day(s) awaiting a decision' : '') + '</div></div></div>';
    }).join('');
    var list = (d.leave || []).map(function (l) {
      var can = String(l.status) === 'Pending';
      return '<div class="tl-item"><div class="tl-h">' + esc(l.type) + ' · ' + dfmt(l.startDate) + ' → ' + dfmt(l.endDate) + '</div>' +
        '<div class="tl-m">' + esc(l.workingDays) + ' working day(s) · ' + esc(l.status) +
        (String(l.halfDay).toUpperCase() === 'TRUE' ? ' · half day' : '') + '</div>' +
        (l.reason ? '<div class="note">' + esc(l.reason) + '</div>' : '') +
        (l.supervisorNote ? '<div class="note">Supervisor: ' + esc(l.supervisorNote) + '</div>' : '') +
        (can ? '<div class="row-actions"><button class="btn small secondary" data-sact="leaveCancel" data-sid="' + esc(l.id) + '">Cancel this request</button></div>' : '') +
        '</div>';
    }).join('') || '<div class="note">No leave recorded.</div>';

    document.getElementById('v-leave').innerHTML =
      card_('My balances ' + esc(d.balances.year), bal) +
      card_('Request leave', '<div class="row-actions"><button class="btn" data-sact="leaveForm">New request</button></div>' +
        '<div class="note">Weekends and public holidays are not counted. Overlapping requests are blocked, and the balance cannot go below zero.</div>') +
      card_('Leave calendar', '<div id="stuCal"></div>') +
      card_('My leave', '<div class="tl">' + list + '</div>');
    stuCalendar();
  });
}

function stuCalendar() {
  stuRun('stuLeaveCalendar', [TOKEN, STU.leaveMonth], function (c) {
    if (!c || c.error) return;
    var hol = {}; (c.holidays || []).forEach(function (h) { hol[h.date] = h.name; });
    var lv = {}; (c.leave || []).forEach(function (l) {
      c.days.forEach(function (d) { if (d.date >= l.from && d.date <= l.to) lv[d.date] = l.type; });
    });
    var cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (x) { return '<div class="dow">' + x + '</div>'; }).join('');
    var first = new Date(Number(STU.leaveMonth.slice(0, 4)), Number(STU.leaveMonth.slice(5, 7)) - 1, 1).getDay();
    for (var i = 0; i < first; i++) cells += '<div></div>';
    (c.days || []).forEach(function (d) {
      var cls = 'd' + (d.weekend ? ' weekend' : '') + (hol[d.date] ? ' hol' : '') + (lv[d.date] ? ' lv' : '');
      cells += '<div class="' + cls + '" title="' + esc(hol[d.date] || lv[d.date] || '') + '">' +
        '<span class="n">' + Number(d.date.slice(8)) + '</span>' +
        (lv[d.date] ? '<span class="tag">' + esc(lv[d.date]) + '</span>' : '') +
        (hol[d.date] ? '<span class="tag">' + esc(hol[d.date]) + '</span>' : '') + '</div>';
    });
    var host = document.getElementById('stuCal');
    if (!host) return;
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    host.innerHTML = '<div class="row-actions" style="justify-content:space-between;align-items:center">' +
      '<button class="btn small secondary" data-sact="calPrev">← Previous</button>' +
      '<b>' + esc(months[Number(STU.leaveMonth.slice(5, 7)) - 1]) + ' ' + esc(STU.leaveMonth.slice(0, 4)) + '</b>' +
      '<button class="btn small secondary" data-sact="calNext">Next →</button></div>' +
      '<div class="cal">' + cells + '</div>';
  });
}

function stuShiftMonth(delta) {
  var y = Number(STU.leaveMonth.slice(0, 4)), m = Number(STU.leaveMonth.slice(5, 7)) - 1 + delta;
  var d = new Date(y, m, 1);
  STU.leaveMonth = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  stuCalendar();
}

function stuLeaveForm() {
  var types = (STU.data.leave && STU.data.leave.types) || ['Annual', 'Emergency', 'Medical (MC)', 'Study/Exam', 'Other'];
  modal('Request leave',
    '<div class="grid2"><div><label for="lvType">Type</label><select id="lvType">' +
      types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="lvHalf">Half day</label><select id="lvHalf"><option value="">No</option><option value="1">Yes (single date)</option></select></div></div>' +
    '<div class="grid2"><div><label for="lvFrom">From</label><input id="lvFrom" type="date"></div>' +
    '<div><label for="lvTo">To</label><input id="lvTo" type="date"></div></div>' +
    '<label for="lvWhy">Reason</label><textarea id="lvWhy" rows="3" style="width:100%;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px"></textarea>' +
    '<div id="lvPrev" class="note"></div>',

     { label: 'Send request', onClick: function () { stuLeaveSubmit(); } },

function stuLeavePreview() {
  var half = document.getElementById('lvHalf').value === '1';
  stuRun('stuLeavePreview', [TOKEN, document.getElementById('lvType').value,
    document.getElementById('lvFrom').value, document.getElementById('lvTo').value, half], function (p) {
    var box = document.getElementById('lvPrev');
    if (!box) return;
    if (p && p.error) { box.innerHTML = '<span style="color:var(--danger)">' + esc(p.error) + '</span>'; return; }
    box.innerHTML = '<b>' + esc(p.workingDays) + ' working day(s)</b> (' + esc(p.calendarDays) + ' calendar). ' +
      ((!p.balance.entitlement && p.balance.entitlement !== 0) ? ''
        : 'Balance after: <b>' + esc(p.balance.after) + '</b>. ') +
      (p.clashes.length ? '<span style="color:var(--danger)">Clashes with leave ' + esc(p.clashes[0].from) + ' → ' + esc(p.clashes[0].to) + '.</span>' :
        (!p.balance.ok ? '<span style="color:var(--danger)">' + esc(p.balance.note) + '</span>' : '<span style="color:var(--good)">No clash.</span>'));
  });
}

function stuLeaveSubmit() {
  var half = document.getElementById('lvHalf').value === '1';
  stuRun('stuSubmitLeave', [TOKEN, { type: document.getElementById('lvType').value,
    startDate: document.getElementById('lvFrom').value, endDate: document.getElementById('lvTo').value,
    halfDay: half, reason: document.getElementById('lvWhy').value }], function (r) {
    if (r && r.error) { toast(r.error, 'bad'); return; }
    stuCloseModal(); toast('Leave request sent (' + r.workingDays + ' working day(s)).', 'good'); stuGo('leave');
  });
}

/* ------------------------------------------------------------- S2 profile */
/** The picture the student has chosen but not saved yet. */
var PENDING_PHOTO = '';

function stuSavePhotoAct() {
  if (!PENDING_PHOTO) { toast('Choose a picture first.', 'bad'); return; }
  stuRun('stuSavePhoto', [TOKEN, PENDING_PHOTO], function (r) {
    if (r && r.error) { toast(r.error, 'bad'); return; }
    toast('Picture saved.', 'good');
    setWhoBar_(STU.data.home ? STU.data.home.student : null, PENDING_PHOTO);
    PENDING_PHOTO = '';
    stuRenderProfile();
  });
}

function stuRemovePhotoAct() {
  stuRun('stuRemovePhoto', [TOKEN], function (r) {
    if (r && r.error) { toast(r.error, 'bad'); return; }
    toast('Picture removed.', 'good');
    PENDING_PHOTO = '';
    setWhoBar_(STU.data.home ? STU.data.home.student : null, null);
    stuRenderProfile();
  });
}

document.addEventListener('change', function (ev) {
  var f = ev.target;
  if (!f || !f.id || f.id !== 'photoFile' || !f.files || !f.files[0]) return;
  var file = f.files[0];
  if (!/^image\//.test(file.type)) { toast('Please choose a picture.', 'bad'); return; }
  toast('Resizing\u2026');
  shrinkPhoto_(file, function (dataUrl) {
    if (!dataUrl) { toast('I could not read that picture.', 'bad'); return; }
    PENDING_PHOTO = dataUrl;
    var el = document.getElementById('profPhoto');
    if (el) el.innerHTML = '<img alt="" src="' + dataUrl + '">';
    toast('Now press "Save this picture".', 'good');
  });
});

function stuRenderProfile() {
  stuRun('stuProfile', [TOKEN], function (p) {
    if (!p || p.error || !p.name) { document.getElementById('v-' + STU.route).innerHTML = card_('Profile', esc(reason_(p))); return; }
    STU.data.profile = p;
    stuRun('stuPhoto', [TOKEN], function (ph) {
      var el = document.getElementById('profPhoto');
      if (el && ph && ph.dataUrl) el.innerHTML = '<img alt="" src="' + ph.dataUrl + '">';
    });
    var rows = [['Name', p.name], ['MMC number', p.mmc], ['Programme', p.program], ['Year / status', p.tahunSt],
                ['University', p.universiti], ['Supervisor', p.supervisor], ['Reporting date', dfmt(p.tarikhLaporDiri)],
                ['Posting ends', dfmt(p.tarikhTamatJabatan)], ['IC number', p.ic]]
      .map(function (r) { return '<div><div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(r[1] || '—') + '</div></div>'; }).join('');
    document.getElementById('v-profile').innerHTML =
      card_('My picture', '<div class="photo-row"><div class="avatar big" id="profPhoto"></div>' +
        '<div><input type="file" id="photoFile" accept="image/*">' +
        '<div class="note">A JPG or PNG. It is shrunk to fit before it is saved, so it stays small.</div></div></div>' +
        '<div class="row-actions"><button class="btn small secondary" data-sact="savePhoto">Save this picture</button>' +
        '<button class="btn small secondary" data-sact="removePhoto">Remove it</button></div>') +
      card_('My record', '<div class="k-v">' + rows + '</div><div class="note">IC number and address are visible to you and the admin only.</div>') +
      card_('Contact details', '<div class="k-v"><div><div class="k">Phone</div><div class="v">' + esc(p.phone || '—') + '</div></div>' +
        '<div><div class="k">Email for sign-in</div><div class="v">' + esc(p.email || '—') + '</div></div>' +
        '<div><div class="k">Address</div><div class="v">' + esc(p.alamat || '—') + '</div></div></div>' +
        '<div class="row-actions"><button class="btn" data-sact="profileEdit">Edit my contact details</button>' +
        '<button class="btn secondary" data-sact="altEmail">Ask to add another email</button></div>');
  });
}

function stuProfileEdit() {
  var p = STU.data.profile || {};
  modal('My contact details', '<label for="pfPhone">Phone</label><input id="pfPhone" type="text" value="' + esc(p.phone || '') + '">' +
    '<label for="pfEmail">Email for sign-in</label><input id="pfEmail" type="email" value="' + esc(p.email || '') + '">' +

          if (r && r.error) { toast(r.error, 'bad'); return; }

function stuAltEmail() {

          stuCloseModal(); toast('Request sent to the admin.', 'good');
        });
      } }, { label: 'Cancel', secondary: true }]);
}

/* --------------------------------------------------------------- S9 inbox */
function stuRenderInbox() {
  stuRun('stuNotifications', [TOKEN], function (d) {
    if (!d || d.error || !d.notifications) { document.getElementById('v-' + STU.route).innerHTML = card_('Inbox', esc(reason_(d))); return; }
    STU.unread = d.unread || 0; stuNavRender();
    var list = (d.notifications || []).map(function (n) {
      return '<div class="att ' + (n.read ? '' : 'warn') + '"><div><b>' + esc(n.title) + '</b>' +
        '<div class="note">' + esc(n.body || '') + '</div>' +
        '<div class="tl-m">' + esc(n.createdAt) + (n.link ? ' · <a href="' + esc(n.link) + '" target="_blank" rel="noopener">open</a>' : '') + '</div></div>' +
        (n.read ? '' : '<button class="btn small secondary" data-sact="readNotif" data-sid="' + esc(n.id) + '">Mark read</button>') +
        '</div>';
    }).join('') || '<div class="note">Nothing in your inbox.</div>';
    document.getElementById('v-inbox').innerHTML =
      card_('Inbox', '<div class="note">' + esc(d.unread) + ' unread. Email is ' +
        (String(d.mailEnabled).toLowerCase() === 'true' ? 'switched on' : 'switched off — the department sends nothing yet') + '.</div>') +
      card_('Messages', list);
  });
}

function stuReadNotif(id) {
  stuRun('stuMarkNotificationRead', [TOKEN, id], function () { stuGo('inbox'); });
}

  <div id="sv-calendar" class="spa-view hidden"></div>
  <div id="sv-meetings" class="spa-view hidden"></div>
  <div id="sv-export" class="spa-view hidden"></div>
</div>

<style>
  .tbl-wrap{overflow-x:auto;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl td{padding:9px 7px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:middle;}
  .tbl tr.clickable{cursor:pointer;}
  .tbl tr.clickable:hover{background:var(--panel-2);}
  .risk{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .risk.red{background:var(--danger);}
  .risk.amber{background:var(--warn);}
  .risk.green{background:var(--good);}
  .mini{display:flex;gap:4px;align-items:center;}
  .mini .bar{flex:1;margin:0;height:5px;}
  .q-item{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
    border-radius:4px;background:var(--panel-2);margin-bottom:8px;}
  .q-item .age{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
  .q-item .age.old{color:var(--danger);}
  .q-item .body{flex:1;min-width:0;}
  .q-item .kind{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .toolbar input[type=text]{max-width:260px;}
  .toolbar select{max-width:200px;}
  .chip{border:1px solid var(--line);background:var(--panel-2);color:var(--paper-dim);border-radius:999px;
    padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--accent);color:#FFFFFF;border-color:var(--accent);font-weight:600;}
  .note-private{border-left:3px solid var(--info);}
</style>

<script>
var SUPP = { route: 'cohort', data: {}, queue: [], selected: {}, filter: 'all', search: '', sort: 'risk',
             month: null, studentId: null };

/* --------------------------------------------------------------- plumbing */
function supRun(fn, args, ok, bad) {
  stuBusy(true, labelFor_(fn));
  google.script.run
    .withSuccessHandler(function (r) {
      stuBusy(false);
      if (r === null || r === undefined) {
        try { google.script.run.clientLog('supervisor ' + SUPP.route + ' <- ' + fn + ' : ' + describe_(r), 'rpc'); } catch (e) {}
      }
      try { ok(r); }
      catch (e) {
        var host = document.getElementById('sv-' + SUPP.route);
        if (host) host.innerHTML = card_('This screen could not be drawn', esc(String(e.message || e)));
        try { google.script.run.clientLog('supervisor render ' + SUPP.route + ' threw: ' + (e.message || e), 'render'); } catch (e2) {}
      }
    })
    .withFailureHandler(function (e) { stuBusy(false); if (bad) bad(fail(e)); else toast(fail(e), 'bad'); })
    [fn].apply(null, args || []);
}

var SUP_ROUTES = [['cohort', 'My students'], ['queue', 'Approvals'], ['calendar', 'Leave calendar'],
                  ['meetings', 'Meetings'], ['export', 'Export']];

function supEnter() {
  var spa = document.getElementById('supSpa');
  if (spa) spa.className = 'spa-wrap';
  supNavRender();
  supGo(SUPP.route || 'cohort');}

function supNavRender() {
  var nav = document.getElementById('supNav');
  if (!nav) return;
  var pending = (SUPP.data.cohort && SUPP.data.cohort.queue) ? SUPP.data.cohort.queue.length : 0;
  nav.innerHTML = SUP_ROUTES.map(function (r) {
    var badge_ = (r[0] === 'queue' && pending) ? '<span class="n">' + pending + '</span>' : '';
    return '<button data-vgo="' + r[0] + '" class="' + (SUPP.route === r[0] ? 'on' : '') + '">' +
      esc(r[1]) + badge_ + '</button>';
  }).join('');
}

/* 'student' is a real route but not a nav button - it is reached from a cohort row. */
var SUP_VIEWS = SUP_ROUTES.concat([['student', 'Student']]);

function supGo(route) {
  if (!SUP_VIEWS.some(function (r) { return r[0] === route; })) route = 'cohort';
  SUPP.route = route;
  document.querySelectorAll('#supSpa .spa-view').forEach(function (v) { v.className = 'spa-view hidden'; });
  var view = document.getElementById('sv-' + route);
  if (view) view.className = 'spa-view';
  supNavRender();
  stuSkeleton('sv-' + route);
  ({ cohort: supRenderCohort, queue: supRenderQueue, student: supRenderStudent,
     calendar: supRenderCalendar, meetings: supRenderMeetings, export: supRenderExport }[route])();
}

document.addEventListener('click', function (ev) {
  var g = ev.target.closest ? ev.target.closest('[data-vgo]') : null;
  if (g) { ev.preventDefault(); supGo(g.getAttribute('data-vgo')); return; }
  var a = ev.target.closest ? ev.target.closest('[data-vact]') : null;
  if (!a) return;
  ev.preventDefault();
  var id = a.getAttribute('data-vid') || '';
  var acts = {
    openStudent: supOpenStudent, decide: supDecideForm, bulk: supBulk, pick: supPick,
    pickAll: supPickAll, verify: supVerifyForm, setDate: supSetDateForm, addMilestone: supAddMilestoneForm,
    note: supNoteForm, comment: supCommentForm, logMeeting: supLogMeetingForm, csv: supDownloadCsv,
    print: supPrint, calPrev: function () { supMonth(-1); }, calNext: function () { supMonth(1); },
    riskFilter: supRiskFilter, markMeeting: supVerifyForm
  };
  if (acts[a.getAttribute('data-vact')]) acts[a.getAttribute('data-vact')](id, a);
});

/* ------------------------------------------------------------ V1 cohort */
function supRenderCohort() {
  supRun('supCohort', [TOKEN], function (d) {
    if (!d || d.error || !d.students) {
      document.getElementById('sv-' + SUPP.route).innerHTML = card_('My students', esc(reason_(d)));
      return;
    }
    SUPP.data.cohort = d;
    supNavRender();
    var rank = { red: 0, amber: 1, green: 2 };
    var rows = d.students.slice();
    if (SUPP.filter !== 'all') rows = rows.filter(function (s) { return s.risk.level === SUPP.filter; });
    var q = SUPP.search.trim().toLowerCase();
    if (q) rows = rows.filter(function (s) { return (s.name + ' ' + s.program + ' ' + s.posting + ' ' + s.universiti).toLowerCase().indexOf(q) > -1; });
    if (SUPP.sort === 'name') rows.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    else if (SUPP.sort === 'pending') rows.sort(function (a, b) { return b.pending - a.pending; });
    else if (SUPP.sort === 'dissertation') rows.sort(function (a, b) { return a.rings.dissertation.weightedPct - b.rings.dissertation.weightedPct; });
    else rows.sort(function (a, b) { return rank[a.risk.level] - rank[b.risk.level] || String(a.name).localeCompare(String(b.name)); });

    var counts = { red: 0, amber: 0, green: 0 };
    d.students.forEach(function (s) { counts[s.risk.level]++; });

    var table = rows.map(function (s) {
      return '<tr class="clickable" data-vact="openStudent" data-vid="' + esc(s.studentId) + '">' +
        '<td><span class="risk ' + esc(s.risk.level) + '"></span><b>' + esc(s.name) + '</b>' +
          '<div class="note" style="margin:2px 0 0">' + esc(s.program || '') + ' · ' + esc(s.tahunSt || '') +
          (s.risk.reasons.length ? ' · ' + esc(s.risk.reasons[0].text) : '') + '</div></td>' +
        '<td>' + esc(s.universiti || '—') + '</td>' +
        '<td>' + esc(s.posting || '—') + (s.status ? '<div class="note" style="margin:2px 0 0">' + esc(s.status) + '</div>' : '') + '</td>' +
        '<td style="min-width:120px"><div class="mini"><span class="mono" style="font-size:11px">' +
          esc(s.rings.dissertation.weightedPct) + '%</span><span class="bar"><i style="width:' + esc(s.rings.dissertation.weightedPct) + '%"></i></span></div>' +
          '<div class="note" style="margin:2px 0 0">' + esc(s.rings.postings.done) + '/' + esc(s.rings.postings.total) + ' postings · ' +
          esc(s.rings.meetings.done) + '/' + esc(s.rings.meetings.total) + ' meetings</div></td>' +
        '<td>' + (s.pending ? '<span class="badge warn">' + esc(s.pending) + '</span>' : '<span class="badge good">none</span>') + '</td>' +
        '<td class="mono" style="font-size:11px">' + esc(s.lastActivity || '—') + '</td></tr>';
    }).join('') || '<tr><td colspan="6" class="note">Nothing matches that.</td></tr>';

    document.getElementById('sv-cohort').innerHTML =
      card_('My students', '<div class="note">' + esc(d.count) + ' assigned to you. ' +
          counts.red + ' need attention now, ' + counts.amber + ' to watch, ' + counts.green + ' on track.</div>' +
        '<div class="toolbar" style="margin-top:12px">' +
          '<input type="text" id="supSearch" placeholder="Search name, programme, posting" value="' + esc(SUPP.search) + '">' +
          '<button class="chip ' + (SUPP.filter === 'all' ? 'on' : '') + '" data-vact="riskFilter" data-vid="all">All</button>' +
          '<button class="chip ' + (SUPP.filter === 'red' ? 'on' : '') + '" data-vact="riskFilter" data-vid="red">Needs attention</button>' +
          '<button class="chip ' + (SUPP.filter === 'amber' ? 'on' : '') + '" data-vact="riskFilter" data-vid="amber">Watch</button>' +
          '<button class="chip ' + (SUPP.filter === 'green' ? 'on' : '') + '" data-vact="riskFilter" data-vid="green">On track</button>' +
          '<select id="supSort"><option value="risk">Sort: risk</option><option value="name">name</option>' +
          '<option value="pending">waiting on me</option><option value="dissertation">least progress</option></select>' +
        '</div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Student</th><th>University</th>' +
        '<th>Posting</th><th>Progress</th><th>Waiting</th><th>Last activity</th></tr></thead><tbody>' +
        table + '</tbody></table></div>') +
      card_('What needs you today', (d.queue.length
        ? d.queue.slice(0, 6).map(function (i) { return supQueueRow(i, false); }).join('') +
          (d.queue.length > 6 ? '<div class="note">and ' + (d.queue.length - 6) + ' more in Approvals.</div>' : '')
        : '<div class="note">Nothing is waiting for a decision.</div>'));
    var s2 = document.getElementById('supSort');
    if (s2) { s2.value = SUPP.sort; s2.addEventListener('change', function () { SUPP.sort = this.value; supRenderCohort(); }); }
    var si = document.getElementById('supSearch');
    if (si) { si.addEventListener('input', function () { SUPP.search = this.value; supRenderCohort(); }); }
  });
}

function supRiskFilter(which) { SUPP.filter = which; supRenderCohort(); }

/* --------------------------------------------------------- V2 approvals */
function supQueueRow(i, selectable) {
  var old = (i.ageDays !== null && i.ageDays > 3);
  return '<div class="q-item">' +
    (selectable ? '<input type="checkbox" data-pick="' + esc(i.kind) + '|' + esc(i.id) + '"' +
      (SUPP.selected[i.kind + '|' + i.id] ? ' checked' : '') + ' style="width:auto;margin-top:3px">' : '') +
    '<div class="body"><div class="kind">' + esc(i.kind) + ' · ' + esc(i.student) + '</div>' +
      '<div>' + esc(i.title) + '</div>' +
      '<div class="note">' + esc(i.detail || '') + '</div></div>' +
    '<div class="age' + (old ? ' old' : '') + '">' + (i.ageDays === null ? '—' : esc(i.ageDays) + 'd') + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<button class="btn small" data-vact="decide" data-vid="' + esc(i.kind + '|' + i.id) + '">Review</button>' +
      '<button class="btn small secondary" data-vact="openStudent" data-vid="' + esc(i.studentId) + '">Student</button>' +
    '</div></div>';
}

function supRenderQueue() {
  supRun('supApprovals', [TOKEN], function (d) {
    if (!d || d.error || !d.items) {
      document.getElementById('sv-' + SUPP.route).innerHTML = card_('Approvals', esc(reason_(d)));
      return;
    }
    SUPP.data.queue = d;
    var kinds = Object.keys(d.byKind || {});
    var chips = kinds.map(function (k) {
      return '<span class="badge info">' + esc(k) + ' ' + esc(d.byKind[k]) + '</span>';
    }).join(' ');
    var picked = Object.keys(SUPP.selected).filter(function (k) { return SUPP.selected[k]; }).length;
    document.getElementById('sv-queue').innerHTML =
      card_('Approvals waiting on me', '<div class="note">' + esc(d.total) + ' item(s)' +
        (d.oldest !== null ? ', oldest ' + esc(d.oldest) + ' day(s)' : '') + '. ' + chips + '</div>' +
        '<div class="toolbar" style="margin-top:12px">' +
          '<button class="chip" data-vact="pickAll">Select all</button>' +
          '<button class="btn small" data-vact="bulk" data-vid="approve"' + (picked ? '' : ' disabled') + '>Approve selected (' + picked + ')</button>' +
          '<button class="btn small secondary" data-vact="bulk" data-vid="reject">Return selected</button>' +
        '</div>' +
        (d.items.length ? d.items.map(function (i) { return supQueueRow(i, true); }).join('')
                        : '<div class="note">Nothing is waiting. Good.</div>'));
  });
}

function supPick(key, box) {
  var parts = key.split('|');
  SUPP.selected[parts[0] + '|' + parts[1]] = box.checked;
  supRenderQueue();
}

function supPickAll() {
  var any = Object.keys(SUPP.selected).some(function (k) { return SUPP.selected[k]; });
  SUPP.selected = {};
  if (!any) (SUPP.data.queue.items || []).forEach(function (i) { SUPP.selected[i.kind + '|' + i.id] = true; });
  supRenderQueue();
}

function supBulk(decision) {
  var items = Object.keys(SUPP.selected).filter(function (k) { return SUPP.selected[k]; })
    .map(function (k) { var p = k.split('|'); return { kind: p[0], id: p[1] }; });
  if (!items.length) { toast('Pick something first.', 'bad'); return; }
  supDecideForm(null, null, items, decision);
}

/** Approve or return one item, or a batch, always with an optional note. */
function supDecideForm(key, node, batch, forced) {
  var items = batch || null;
  var kindLabel = items ? items.length + ' item(s)' : String(key).split('|')[0];
  var body = '<div class="note">' + esc(items ? 'Deciding ' + items.length + ' item(s) at once.'
    : 'Approve this, or return it with a reason.') + '</div>' +
    '<label for="dNote">Note to the student (required when returning)</label>' +
    '<textarea id="dNote" rows="3" style="width:100%;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px"></textarea>';
  var buttons = [];
  if (!forced || forced === 'approve') buttons.push({ label: 'Approve', onClick: function () {
    supSendDecision(items, key, 'approve', document.getElementById('dNote').value); } });
  if (!forced || forced === 'reject') buttons.push({ label: 'Return with note', secondary: true, onClick: function () {
    supSendDecision(items, key, 'reject', document.getElementById('dNote').value); } });
  buttons.push({ label: 'Cancel', secondary: true });
  modal((forced === 'reject' ? 'Return' : 'Approve') + ' — ' + kindLabel, body, buttons);
}

function supSendDecision(batch, key, decision, note) {
  if (batch && batch.length) {
    supRun('supBulkDecide', [TOKEN, batch, decision, note], function (r) {
      if (r && r.error) { toast(r.error, 'bad'); return; }
      stuCloseModal(); SUPP.selected = {};
      toast('Done: ' + r.done + ' approved' + (r.failed.length ? ', ' + r.failed.length + ' failed' : ''), 'good');
      supGo('queue');
    });
    return;
  }
  var parts = String(key).split('|');
  supRun('supDecide', [TOKEN, parts[0], parts[1], decision, note], function (r) {
    if (r && r.error) { toast(r.error, 'bad'); return; }
    stuCloseModal();
    toast((r.decision === 'Approved' ? 'Approved' : 'Returned') + ' — ' + r.student, 'good');
    if (SUPP.route === 'student') supRenderStudent(); else supGo('queue');
  });
}

/* ----------------------------------------------------- V3 one student page */
function supOpenStudent(studentId) { SUPP.studentId = studentId; supGo('student'); }

function supRenderStudent() {
  if (!SUPP.studentId) { supGo('cohort'); return; }
  supRun('supStudent', [TOKEN, SUPP.studentId], function (d) {
    if (!d || d.error || !d.student) {
      document.getElementById('sv-student').innerHTML = card_('Student', esc(reason_(d)));
      return;
    }
    var s = d.student, r = d.rings;
    setWhoBar_(null, null);                       // their own header, not this student's
    supRun('supStudentPhoto', [TOKEN, SUPP.studentId], function (ph) {
      var el = document.getElementById('supStuPhoto');
      if (el && ph && ph.dataUrl) el.innerHTML = '<img alt="" src="' + ph.dataUrl + '">';
    });
    var head = '<button class="chip" data-vact="openStudent" data-vid="">← all students</button>' +
      '<div class="photo-row" style="margin-top:12px"><div class="avatar big" id="supStuPhoto"></div>' +
      '<div><div class="facts" style="font-size:13px">' + esc(whoLine_(s)) + '</div></div></div>' +
      '<div class="k-v" style="margin-top:12px">' +
      [['Name', s.name], ['MMC', s.mmc], ['Programme', s.program], ['Year / status', s.tahunSt],
       ['University', s.universiti], ['Status', s.status], ['Posting now', s.jab], ['Period', s.tempoh]]
      .map(function (p) { return '<div><div class="k">' + esc(p[0]) + '</div><div class="v">' + esc(p[1] || '—') + '</div></div>'; }).join('') +
      '</div><div class="note">IC number, address and phone are held by the admin only.</div>';

    var risk = d.risk.reasons.length
      ? d.risk.reasons.map(function (x) { return '<div class="att ' + esc(x.level === 'red' ? 'high' : 'warn') + '"><div>' + esc(x.text) + '</div></div>'; }).join('')
      : '<div class="note">Nothing is out of step.</div>';

    var rings = '<div class="rings">' +
      ring(r.dissertation.weightedPct, 'Dissertation', r.dissertation.done + ' of ' + r.dissertation.total) +
      ring(r.postings.pct, 'Postings', r.postings.done + ' of ' + r.postings.total) +
      ring(r.readiness.pct, 'Pass readiness', r.readiness.done + ' of ' + r.readiness.total) +
      ring(r.meetings.pct, 'Meetings', r.meetings.done + ' of ' + r.meetings.total) + '</div>';

    var queue = d.queue.length
      ? d.queue.map(function (i) { return supQueueRow(i, false); }).join('')
      : '<div class="note">Nothing of theirs is waiting on you.</div>';

    var posts = d.postings.map(function (p) {
      var acts = (String(p.status) === 'Pending Verification')
        ? '<div class="row-actions"><button class="btn small" data-vact="verify" data-vid="posting|' + esc(p.id) + '">Verify</button>' +
          '<button class="btn small secondary" data-vact="verify" data-vid="posting|' + esc(p.id) + '|reject">Return</button></div>' : '';
      return '<div class="tl-item ' + (String(p.status) === 'Completed' ? 'ok' : (String(p.status) === 'Pending Verification' ? 'now' : '')) + '">' +
        '<div class="tl-h">' + esc(p.tempat || ('Round ' + p.roundNo)) + '</div>' +
        '<div class="tl-m">' + esc(p.startDate || '—') + ' → ' + esc(p.endDate || '—') + ' · ' + esc(p.status) + '</div>' +
        (p.studentNote ? '<div class="note">' + esc(p.studentNote) + '</div>' : '') +
        (p.evaluationUrl ? '<div class="tl-m"><a href="' + esc(p.evaluationUrl) + '" target="_blank" rel="noopener">document</a></div>' : '') + acts + '</div>';
    }).join('') || '<div class="note">No postings recorded.</div>';

    var ms = d.milestones.map(function (m) {
      var acts = '<div class="row-actions">' +
        (String(m.status) === 'Submitted'
          ? '<button class="btn small" data-vact="verify" data-vid="milestone|' + esc(m.id) + '">Verify</button>' +
            '<button class="btn small secondary" data-vact="verify" data-vid="milestone|' + esc(m.id) + '|reject">Return for revision</button>'
          : '') +
        '<button class="btn small secondary" data-vact="setDate" data-vid="' + esc(m.id) + '">Set target date</button>' +
        '<button class="btn small secondary" data-vact="comment" data-vid="' + esc(m.id) + '">Comment</button></div>';
      return '<div class="tl-item ' + (String(m.status) === 'Verified' ? 'ok' : (String(m.status) === 'Revision requested' ? 'bad' : '')) + '">' +
        '<div class="tl-h">' + esc(m.milestone) + '</div>' +
        '<div class="tl-m">' + esc(m.status) + ' · target ' + esc(m.targetDate || m.proposedTargetDate || 'not set') +
        (m.weight ? ' · weight ' + esc(m.weight) + '%' : '') + '</div>' +
        (m.progressNote ? '<div class="note">' + esc(m.progressNote) + '</div>' : '') +
        (m.supervisorNote ? '<div class="note">My note: ' + esc(m.supervisorNote) + '</div>' : '') + acts + '</div>';
    }).join('') || '<div class="note">No milestones.</div>';

    var leave = d.leave.list.map(function (l) {
      var acts = (String(l.status) === 'Pending')
        ? '<div class="row-actions"><button class="btn small" data-vact="decide" data-vid="leave|' + esc(l.id) + '">Decide</button></div>' : '';
      return '<div class="tl-item"><div class="tl-h">' + esc(l.type) + ' · ' + esc(l.startDate) + ' → ' + esc(l.endDate) + '</div>' +
        '<div class="tl-m">' + esc(l.workingDays) + ' working day(s) · ' + esc(l.status) + '</div>' +
        (l.reason ? '<div class="note">' + esc(l.reason) + '</div>' : '') + acts + '</div>';
    }).join('') || '<div class="note">No leave recorded.</div>';

    var bal = (d.leave.balances.balances || []).map(function (b) {
      return '<div class="att"><div><b>' + esc(b.type) + '</b><div class="note">' +
        ((!b.entitlement && b.entitlement !== 0) ? 'No limit set' : esc(b.remaining) + ' of ' + esc(b.entitlement) + ' left') +
        (b.pending ? ' · ' + esc(b.pending) + ' pending' : '') + '</div></div></div>';
    }).join('');

    var meetings = d.meetings.map(function (m) {
      return '<div class="tl-item"><div class="tl-h">' + esc(m.date) + ' · ' + esc(m.mode) + '</div>' +
        '<div class="note">' + esc(m.summary) + '</div>' +
        (m.nextMeeting ? '<div class="tl-m">Next: ' + esc(m.nextMeeting) + '</div>' : '') + '</div>';
    }).join('') || '<div class="note">No meetings logged.</div>';

    var docs = d.documents.map(function (x) {
      return '<div class="tl-item"><div class="tl-h">' + esc(x.title) + '</div>' +
        '<div class="tl-m">' + esc(x.category) + ' · ' + esc(x.status) + ' · ' + esc(x.uploadedAt) + '</div>' +
        (x.url ? '<div class="tl-m"><a href="' + esc(x.url) + '" target="_blank" rel="noopener">open</a></div>' : '') + '</div>';
    }).join('') || '<div class="note">Nothing on file.</div>';

    var shared = d.comments.filter(function (c) { return String(c.visibility) !== 'staff'; }).map(function (c) {
      return '<div class="tl-item"><div class="tl-h">' + esc(c.who) + ' · ' + esc(String(c.at).slice(0, 16)) + '</div>' +
        '<div class="note">' + esc(c.text) + '</div></div>';

    var priv = d.staffNotes.map(function (c) {
      return '<div class="att info note-private"><div>' + esc(c.text) +
        '<div class="note">' + esc(String(c.at).slice(0, 16)) + ' · staff only</div></div></div>';
    }).join('') || '<div class="note">No private notes yet.</div>';

  });
}
