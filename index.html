/* ------------------------------------------------------ V5 team calendar */
function supRenderCalendar() {
  if (!SUPP.month) {
    var n = new Date();
    SUPP.month = n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2);
  }
  supRun('supLeaveCalendar', [TOKEN, SUPP.month], function (c) {
    if (!c || c.error || !c.days) {
      document.getElementById('sv-calendar').innerHTML = card_('Leave calendar', esc(reason_(c)));
      return;
    }
    var hol = {}, lv = {};
    (c.holidays || []).forEach(function (h) { hol[h.date] = h.name; });
    (c.byStudent || []).forEach(function (s) {
      s.away.forEach(function (a) { c.days.forEach(function (d) { if (d.date >= a.from && d.date <= a.to) lv[d.date] = (lv[d.date] || 0) + 1; }); });
    });
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (x) { return '<div class="dow">' + x + '</div>'; }).join('');
    var first = new Date(Number(SUPP.month.slice(0, 4)), Number(SUPP.month.slice(5, 7)) - 1, 1).getDay();
    for (var i = 0; i < first; i++) cells += '<div></div>';
    c.days.forEach(function (d) {
      var cls = 'd' + (d.weekend ? ' weekend' : '') + (hol[d.date] ? ' hol' : '') + (lv[d.date] ? ' lv' : '');
      cells += '<div class="' + cls + '" title="' + esc(hol[d.date] || (lv[d.date] ? lv[d.date] + ' away' : '')) + '">' +
        '<span class="n">' + Number(d.date.slice(8)) + '</span>' +
        (lv[d.date] ? '<span class="tag">' + lv[d.date] + ' away</span>' : '') + '</div>';
    });
    var away = (c.byStudent || []).map(function (s) {
      return '<div class="att"><div><b>' + esc(s.name) + '</b>' +
        s.away.map(function (a) { return '<div class="note">' + esc(a.from) + ' → ' + esc(a.to) + ' · ' + esc(a.type) + ' · ' + esc(a.status) + '</div>'; }).join('') +
        '</div></div>';
    }).join('') || '<div class="note">Nobody has leave in this month.</div>';
    document.getElementById('sv-calendar').innerHTML =
      card_('Team leave', '<div class="row-actions" style="justify-content:space-between;align-items:center">' +
        '<button class="btn small secondary" data-vact="calPrev">← Previous</button><b>' +
        esc(months[Number(SUPP.month.slice(5, 7)) - 1]) + ' ' + esc(SUPP.month.slice(0, 4)) +
        '</b><button class="btn small secondary" data-vact="calNext">Next →</button></div>' +
        '<div class="cal" style="margin-top:10px">' + cells + '</div>') +
      card_('Who is away', away);
  });
}

function supMonth(delta) {
  var y = Number(SUPP.month.slice(0, 4)), m = Number(SUPP.month.slice(5, 7)) - 1 + delta;
  var d = new Date(y, m, 1);
  SUPP.month = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  supRenderCalendar();
}

/* ---------------------------------------------------------- V6 meetings */
function supRenderMeetings() {

    }).join('');
    var list = d.meetings.slice(0, 40).map(function (m) {
      return '<div class="tl-item"><div class="tl-h">' + esc(m.date) + ' · ' + esc(m.student) + ' · ' + esc(m.mode) + '</div>' +
        '<div class="note">' + esc(m.summary) + '</div>' +

    document.getElementById('sv-meetings').innerHTML =

        '<div class="note">Log one from a student page.</div>') +
      card_('Recent meetings', '<div class="tl">' + list + '</div>');
  });
}

/* ------------------------------------------------------------ V7 export */
function supRenderExport() {
  supRun('supCohort', [TOKEN], function (d) {

    }).join('');
    document.getElementById('sv-export').innerHTML =
      card_('Export and print', '<div class="note">A CSV opens in Excel; the printable summary is for a department meeting.</div>' +
        '<div class="row-actions" style="margin-top:10px">' +
        '<button class="btn" data-vact="csv">Download CSV</button>' +
        '<button class="btn secondary" data-vact="print">Printable summary</button></div>') +
      card_('Cohort summary', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>No</th><th>Name</th>' +
        '<th>Programme</th><th>University</th><th>Posting</th><th>Dissertation</th><th>Postings</th><th>Risk</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>');
  });
}

function supDownloadCsv() {
  supRun('supExport', [TOKEN], function (r) {
    if (!r || r.error || !r.csv) { toast('Could not build the CSV.', 'bad'); return; }
    var blob = new Blob([r.csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = r.filename || 'cohort.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Saved ' + (r.rows || 0) + ' rows.', 'good');
  });
}

function supPrint() {
  var d = SUPP.data.cohort;
  if (!d || !d.students) { toast('Nothing to print yet.', 'bad'); return; }
  var w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to print.', 'bad'); return; }
  var rows = d.students.map(function (s) {
    return '<tr><td>' + esc(s.no) + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.program) + '</td>' +
      '<td>' + esc(s.universiti) + '</td><td>' + esc(s.posting || '') + '</td>' +
      '<td>' + esc(s.rings.dissertation.weightedPct) + '%</td><td>' + esc(s.risk.level) + '</td>' +
      '<td>' + esc(s.risk.reasons.map(function (x) { return x.text; }).join('; ')) + '</td></tr>';
  }).join('');
  w.document.write('<html><head><title>Cohort summary</title><style>body{font-family:sans-serif;font-size:12px}' +
    'table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;text-align:left}' +
    'th{background:#eee}</style></head><body><h2>Masters cohort — ' + esc(d.supervisor) + '</h2>' +
    '<p>' + esc(d.count) + ' students, printed ' + esc(new Date().toISOString().slice(0, 10)) + '</p>' +
    '<table><thead><tr><th>No</th><th>Name</th><th>Programme</th><th>University</th><th>Posting</th>' +
    '<th>Dissertation</th><th>Risk</th><th>Why</th></tr></thead><tbody>' + rows + '</tbody></table></body></html>');
  w.document.close();
  w.focus();
  setTimeout(function () { w.print(); }, 300);
}
</script>

<script>
var ADM = { route: 'dashboard', data: {}, picked: {}, filters: {}, search: '', studentId: null, month: null };

function admRun(fn, args, ok, bad) {
  stuBusy(true, labelFor_(fn));
  google.script.run
    .withSuccessHandler(function (r) {
      stuBusy(false);
      if (r === null || r === undefined) {
        try { google.script.run.clientLog('admin ' + ADM.route + ' <- ' + fn + ' : ' + describe_(r), 'rpc'); } catch (e) {}
      }
      try { ok(r); }
      catch (e) {
        var host = document.getElementById('av-' + ADM.route);
        if (host) host.innerHTML = card_('This screen could not be drawn', esc(String(e.message || e)));
        try { google.script.run.clientLog('admin render ' + ADM.route + ' threw: ' + (e.message || e), 'render'); } catch (e2) {}
      }
    })
    .withFailureHandler(function (e) { stuBusy(false); if (bad) bad(fail(e)); else toast(fail(e), 'bad'); })
    [fn].apply(null, args || []);
}

var ADM_ROUTES = [['dashboard', 'Dashboard'], ['students', 'Students'], ['planner', 'Rotation'],
                  ['leave', 'Leave'], ['thesis', 'Dissertation'], ['supervisors', 'Supervisors'],
                  ['users', 'Users'], ['settings', 'Settings'], ['notices', 'Notices'],
                  ['audit', 'Audit & backup'], ['reports', 'Reports']];
var ADM_VIEWS = ADM_ROUTES.concat([['file', 'Student file']]);

function admEnter() {
  var spa = document.getElementById('admSpa');
  if (spa) spa.className = 'spa-wrap';
  admNavRender();
  admGo(ADM.route || 'dashboard');}

function admNavRender() {
  var nav = document.getElementById('admNav');
  if (!nav) return;
  nav.innerHTML = ADM_ROUTES.map(function (r) {
    return '<button data-ago="' + r[0] + '" class="' + (ADM.route === r[0] ? 'on' : '') + '">' + esc(r[1]) + '</button>';
  }).join('');
}

function admGo(route) {
  if (!ADM_VIEWS.some(function (r) { return r[0] === route; })) route = 'dashboard';
  ADM.route = route;
  document.querySelectorAll('#admSpa .spa-view').forEach(function (v) { v.className = 'spa-view hidden'; });
  var view = document.getElementById('av-' + route);
  if (view) view.className = 'spa-view';
  admNavRender();
  stuSkeleton('av-' + route);
  ({ dashboard: admRenderDashboard, students: admRenderStudents, planner: admRenderPlanner,
     leave: admRenderLeave, thesis: admRenderThesis, supervisors: admRenderSupervisors,
     users: admRenderUsers, settings: admRenderSettings, notices: admRenderNotices,
     audit: admRenderAudit, reports: admRenderReports, file: admRenderFile }[route])();
}

document.addEventListener('click', function (ev) {
  var g = ev.target.closest ? ev.target.closest('[data-ago]') : null;
  if (g) { ev.preventDefault(); admGo(g.getAttribute('data-ago')); return; }
  var a = ev.target.closest ? ev.target.closest('[data-aact]') : null;
  if (!a) return;
  ev.preventDefault();
  var id = a.getAttribute('data-aid') || '';
  var acts = {
    filter: admFilter, openFile: function (sid) { ADM.studentId = sid; admGo('file'); },
    pick: admPick, pickAll: admPickAll, bulk: admBulk, editField: admEditField,
    importCsv: admImportCsv, dupes: admDuplicates, exportCsv: admExportCsv,

    leaveDecide: admLeaveDecide, leaveEdit: admLeaveEdit, leaveDelete: admLeaveDelete,
    entitlement: admEntitlementForm, holiday: admHolidayForm, delHoliday: admDelHoliday,
    requirement: admRequirementForm, delRequirement: admDelRequirement,
    template: admTemplateForm, applyTemplate: admApplyTemplate,
    merge: admMerge, nudge: admNudge, user: admUserForm, delUser: admDelUser,
    setting: admSettingForm, announcement: admAnnouncementForm, delAnnouncement: admDelAnnouncement,
    savePhoto: admSavePhotoAct,
    backup: admBackup, reminders: admReminders, trigger: admTrigger,
    reportCohort: admReportCohort, reportStudent: admReportStudent, filterClear: admFilterClear,
    editPlanner: admPlannerEdit, addPosting: admAddPosting, editPosting: admEditPosting,
    delPosting: admDelPosting
  };
  if (acts[a.getAttribute('data-aact')]) acts[a.getAttribute('data-aact')](id, a);
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest ? ev.target.closest('select[data-aact]') : null;
  if (!a) return;
  if (a.getAttribute('data-aact') === 'plannerRange') admPlannerRange(a.value);
});

/* --------------------------------------------------------- A1 dashboard */
function admRenderDashboard() {
  admRun('adminDashboard', [TOKEN], function (d) {
    if (!d || d.error || !d.counts) {
      document.getElementById('av-' + ADM.route).innerHTML = card_('Dashboard', esc(reason_(d)));
      return;
    }
    ADM.data.dash = d;
    var c = d.counts;
    var kpi = '<div class="kpi">' +
      kpiBox('students', 'Students', c.students, 'all') +
      kpiBox('pending', 'Waiting on supervisors', c.pendingLeave + c.pendingOther, 'pending') +
      kpiBox('risk', 'At risk', c.atRisk, 'risk') +
      kpiBox('logins', 'Cannot sign in', c.cannotLogIn, 'logins') +
      kpiBox('leave', 'Leave used', d.leave.pct + '%', 'leave') +
      kpiBox('thesis', 'Milestones verified', d.milestones.pct + '%', 'thesis') + '</div>';

    function barRows(obj, label) {
      var keys = Object.keys(obj || {}).sort(function (a, b) { return obj[b] - obj[a]; });
      var total = keys.reduce(function (t, k) { return t + obj[k]; }, 0) || 1;
      return keys.slice(0, 10).map(function (k) {
        return '<div class="bar-row"><span>' + esc(k) + '</span><span class="track"><i style="width:' +
          Math.round(obj[k] * 100 / total) + '%"></i></span><span class="mono">' + obj[k] + '</span></div>';
      }).join('');
    }
    var funnelTotal = Object.keys(d.funnel).reduce(function (t, k) { return t + d.funnel[k]; }, 0) || 1;
    var funnel = Object.keys(d.funnel).map(function (k) {

function kpiBox(key, label, n, filter) {

    '</div><div class="l">' + esc(label) + '</div></div>';
}
function admFilter(which) {
  ADM.filters = {};
  ADM.search = '';
  if (which === 'risk') ADM.filters.risk = 'notgreen';
  else if (which === 'pending') ADM.filters.pending = true;
  else if (which === 'logins') ADM.filters.noLogin = true;
  else if (which === 'thesis') ADM.filters.thesis = true;
  else if (which === 'leave') ADM.filters.leave = true;
  admGo('students');
}
function admFilterClear() { ADM.filters = {}; admRenderStudents(); }

/* ---------------------------------------------------------- A2 students */
function admRenderStudents() {
  admRun('adminStudents', [TOKEN, { includeArchived: !!ADM.filters.archived, search: ADM.search }], function (d) {
    if (!d || d.error || !d.students) {
      document.getElementById('av-' + ADM.route).innerHTML = card_('Students', esc(reason_(d)));
      return;
    }
    ADM.data.students = d;
    var rows = d.students.slice();
    var f = ADM.filters;
    if (f.risk === 'notgreen') rows = rows.filter(function (s) { return s.risk.level !== 'green'; });
    if (f.pending) rows = rows.filter(function (s) { return s.pending > 0; });
    if (f.noLogin) rows = rows.filter(function (s) { return !s.email; });
    if (f.archived) rows = rows.filter(function (s) { return s.archived; });

    var pickedCount = Object.keys(ADM.picked).filter(function (k) { return ADM.picked[k]; }).length;
    var body = rows.map(function (s) {
      return '<tr><td><input type="checkbox" class="pickbox" data-pick="' + esc(s.studentId) + '"' +
        (ADM.picked[s.studentId] ? ' checked' : '') + '></td>' +
        '<td><span class="risk ' + esc(s.risk.level) + '"></span><span class="inline-edit" data-aact="editField" data-aid="' +
        esc(s.studentId) + '|NAMA">' + esc(s.name) + '</span>' +
        '<div class="note" style="margin:2px 0 0"><span class="inline-edit" data-aact="editField" data-aid="' +
        esc(s.studentId) + '|SUPERVISOR">' + esc(s.supervisor || 'no supervisor') + '</span>' +
        (s.archived ? ' · archived' : '') + '</div></td>' +
        '<td><span class="inline-edit" data-aact="editField" data-aid="' + esc(s.studentId) + '|MMC">' +
        esc(s.mmc || '—') + '</span></td>' +
        '<td><span class="inline-edit" data-aact="editField" data-aid="' + esc(s.studentId) +
        '|PROGRAM">' + esc(s.program || '—') + '</span></td>' +
        '<td><span class="inline-edit" data-aact="editField" data-aid="' + esc(s.studentId) +
        '|STATUS">' + esc(s.status || '—') + '</span></td>' +
        '<td><span class="inline-edit" data-aact="editField" data-aid="' + esc(s.studentId) +
        '|JAB">' + esc(s.jab || '—') + '</span></td>' +
        '<td class="mono">' + esc(s.rings.dissertation.weightedPct) + '%</td>' +
        '<td>' + (s.pending ? '<span class="badge warn">' + esc(s.pending) + '</span>' : '') + '</td>' +
        '<td><button class="btn small secondary" data-aact="openFile" data-aid="' + esc(s.studentId) +
        '">File</button></td></tr>';
    }).join('') || '<tr><td colspan="9" class="note">Nothing matches.</td></tr>';

    document.getElementById('av-students').innerHTML =
      card_('Students (' + rows.length + ((f.risk || f.pending || f.noLogin || f.archived) ? ', filtered' : '') + ')',
        '<div class="toolbar">' +
        '<input type="text" id="admSearch" placeholder="Search name, IC, MMC, supervisor" value="' + esc(ADM.search) + '">' +
        (Object.keys(ADM.filters).length ? '<button class="chip" data-aact="filterClear">Clear filter</button>' : '') +
        '<button class="chip" data-aact="pickAll">' + (pickedCount ? 'Unselect all' : 'Select all') + '</button>' +
        '<button class="btn small" data-aact="bulk" data-aid="supervisor">Assign supervisor (' + pickedCount + ')</button>' +
        '<button class="btn small secondary" data-aact="bulk" data-aid="status">Set status</button>' +
        '<button class="btn small secondary" data-aact="bulk" data-aid="archive">Archive</button>' +
        '<button class="btn small secondary" data-aact="bulk" data-aid="restore">Restore</button>' +
        '<button class="btn small secondary" data-aact="exportCsv">Export CSV</button>' +
        '<button class="btn small secondary" data-aact="importCsv">Import CSV</button>' +
        '<button class="btn small secondary" data-aact="dupes">Find duplicates</button>' +
        '</div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Student</th><th>MMC</th>' +
        '<th>Programme</th><th>Status</th><th>Posting</th><th>Thesis</th><th>Waiting</th><th></th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<div class="note">Click any underlined value to edit it. Every edit is written to AuditLog.</div>');

    if (si) {
      si.addEventListener('input', function () { ADM.search = this.value; clearTimeout(si._t);
        si._t = setTimeout(admRenderStudents, 400); });
    }
  });
}
function admPick(key, box) { ADM.picked[key] = box.checked; admRenderStudents(); }
function admPickAll() {
  var any = Object.keys(ADM.picked).some(function (k) { return ADM.picked[k]; });
  ADM.picked = {};
  if (!any) (ADM.data.students.students || []).forEach(function (s) { ADM.picked[s.studentId] = true; });
  admRenderStudents();
}
document.addEventListener('change', function (ev) {
  var b = ev.target;
  if (!b || !b.getAttribute || !b.getAttribute('data-pick')) return;
  ADM.picked[b.getAttribute('data-pick')] = b.checked;
  admRenderStudents();
});

function admBulk(action) {
  var ids = Object.keys(ADM.picked).filter(function (k) { return ADM.picked[k]; });
  if (!ids.length) { toast('Pick at least one student.', 'bad'); return; }
  if (action === 'archive' || action === 'restore') {
    admRun('adminBulkStudents', [TOKEN, ids, action, ''], function (r) {
      if (r && r.error) { toast(r.error, 'bad'); return; }
      ADM.picked = {}; toast(action + 'd ' + r.changed + ' student(s).', 'good'); admRenderStudents();
    });
    return;
  }
  var label = action === 'supervisor' ? 'Assign which supervisor?' : 'Set which status?';
  var list = (ADM.data.students.supervisors || []).join(', ');
  modal(label, '<div class="note">' + (action === 'supervisor' ? 'Supervisors seen in the roster: ' + esc(list) : 'e.g. ACTIVE, ROTATION, IN CAMPUS') + '</div>' +
    '<label for="bv">Value</label><input id="bv" type="text">',
    [{ label: 'Apply', onClick: function () {
        admRun('adminBulkStudents', [TOKEN, ids, action, document.getElementById('bv').value], function (r) {
          if (r && r.error) { toast(r.error, 'bad'); return; }
          stuCloseModal(); ADM.picked = {}; toast('Updated ' + r.changed + '.', 'good'); admRenderStudents();
        });
      } }, { label: 'Cancel', secondary: true }]);
}

function admEditField(key) {
  var parts = String(key).split('|');
  var sid = parts[0], field = parts[1];
  var row = null;
  (ADM.data.students.students || []).forEach(function (s) { if (s.studentId === sid) row = s; });
  if (!row) return;
  var current = { NAMA: row.name, MMC: row.mmc, PROGRAM: row.program, STATUS: row.status, JAB: row.jab,
                  SUPERVISOR: row.supervisor, 'NO K/P': row.ic, 'NO. TEL': row.phone, EMAIL: row.email,
                  ALAMAT: row.alamat, UNIVERSITI: row.universiti, 'TAHUN /ST': row.tahunSt,
                  adminNotes: row.adminNotes, intake: row.intake,
                  expectedGraduation: row.expectedGraduation, altEmails: row.altEmails }[field];
  modal('Edit ' + field, '<div class="note">Student: ' + esc(row.name) + '</div>' +
    '<label for="ef">New value</label><input id="ef" type="text" value="' + esc(current || '') + '">',
    [{ label: 'Save', onClick: function () {
        var patch = {};

        admRun('adminSaveStudent', [TOKEN, sid, patch], function (r) {
          if (r && r.error) { toast(r.error, 'bad'); return; }

        });

function admDuplicates() {
  admRun('adminDuplicates', [TOKEN], function (r) {
    if (!r || r.error) { toast(reason_(r), 'bad'); return; }
    var body = (r.duplicates || []).length
      ? r.duplicates.map(function (g) {

function admExportCsv() {
  admRun('adminExportStudents', [TOKEN], function (r) {
    if (!r || !r.csv) { toast('Could not build the file.', 'bad'); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([r.csv], { type: 'text/csv;charset=utf-8' }));
    a.download = r.filename || 'students.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Exported ' + r.rows + ' rows.', 'good');
  });
}

function admImportCsv() {
  modal('Import students from CSV',
    '<div class="note">Paste a CSV whose first row is the sheet\u2019s own column names (NAMA, MMC, PROGRAM\u2026). Nothing is written until you press Import, and the check runs first.</div>' +
    '<label for="csvText">CSV</label><textarea id="csvText" rows="7" style="width:100%;font-family:IBM Plex Mono,monospace;font-size:12px;background:var(--panel-3);border:1px solid var(--line);color:var(--paper);border-radius:4px;padding:9px"></textarea>' +

function isoToday_() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function isoPlus_(iso, days) {
  var p = String(iso).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + Number(days || 0));
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

<script>
var TOKEN = null, OPTIONS = null;
var NAMES = { stu: [], sup: [] };

function el(id) { return document.getElementById(id); }
function show_(view) {
  el('loginView').className = (view === 'login') ? '' : 'hidden';
  el('appView').className   = (view === 'login') ? 'hidden' : '';
}
function err(msg) { var e = el('loginErr'); e.className = 'err'; e.textContent = msg; }
function problem(msg) { var a = el('appErr'); a.className = 'err'; a.textContent = msg; }
function clearMsgs() { el('loginErr').className = 'err hidden'; el('appErr').className = 'err hidden'; }
function fail(e) { return (e && e.message) ? e.message : String(e); }

function pick(role) {
  ['Student', 'Supervisor', 'Admin'].forEach(function (r) {
    el('t' + r).className = 'tab-btn' + (r === role ? ' on' : '');
    el('form' + r).className = (r === role) ? '' : 'hidden';
  });
  el('loginErr').className = 'err hidden';
}

/* ------------------------------------------------------- name type-ahead */
function setNames(key, values) { NAMES[key] = (values || []).slice(); }

/* Every button carries data-act instead of an inline onclick, so no user text is ever
   baked into an event handler. One listener serves them all. */
document.addEventListener('click', function (ev) {
  var node = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!node) return;
  var acts = { pick: pick, doStudent: doStudent, doSupervisor: doSupervisor, doAdmin: doAdmin,
               signOut: signOut, refreshPins: refreshPins, syncMmc: syncMmc, applyMmc: applyMmc };
  var fn = acts[node.getAttribute('data-act')];
  if (fn) { ev.preventDefault(); fn(node.getAttribute('data-arg')); }
});

function esc(t) {
  return String(t === undefined || t === null ? '' : t)
    .replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; });
}

function matches(key, typed) {
  var q = String(typed || '').trim().toLowerCase();
  var all = NAMES[key];
  if (!q) return all.slice(0, 8);
  var starts = [], contains = [];
  all.forEach(function (n) {
    var l = n.toLowerCase();
    if (l.indexOf(q) === 0) starts.push(n);
    else if (l.indexOf(q) > -1) contains.push(n);
  });
  return starts.concat(contains);
}

function suggest(key) {
  var box = el(key + 'List');
  var typed = el(key + 'Name').value;
  var found = matches(key, typed);

  if (!NAMES[key].length) {
    box.innerHTML = '<li class="none">The name list has not loaded. Refresh the page.</li>';
    box.className = 'on'; return;
  }
  if (!found.length) {
    box.innerHTML = '<li class="none">No name matches that. Check the spelling, or ask the admin.</li>';
    box.className = 'on'; return;
  }

  var q = String(typed || '').trim();
  box.innerHTML = found.slice(0, 8).map(function (n) {
    var label = esc(n);
    if (q) {
      var i = n.toLowerCase().indexOf(q.toLowerCase());
      if (i > -1) {
        label = esc(n.substring(0, i)) + '<b>' + esc(n.substring(i, i + q.length)) + '</b>' +
                esc(n.substring(i + q.length));
      }
    }
    return '<li onmousedown="pickName(\'' + key + '\', this)" data-v="' + esc(n) + '">' + label + '</li>';
  }).join('') + (found.length > 8 ? '<li class="more">' + (found.length - 8) + ' more — keep typing</li>' : '');
  box.className = 'on';
}

function pickName(key, li) {
  el(key + 'Name').value = li.getAttribute('data-v');
  el(key + 'List').className = '';
  el('loginErr').className = 'err hidden';
}
function closeSugg(key) {
  setTimeout(function () { el(key + 'List').className = ''; }, 150);   // let the tap land first
}
function exact(key) {
  var typed = String(el(key + 'Name').value || '').trim();
  for (var i = 0; i < NAMES[key].length; i++) {
    if (NAMES[key][i].toLowerCase() === typed.toLowerCase()) return NAMES[key][i];
  }
  return null;
}

/* ------------------------------------------------------------- page load */
window.addEventListener('load', function () {
  google.script.run
    .withSuccessHandler(function (o) {
      OPTIONS = o || {};
      setNames('stu', OPTIONS.students || []);
      setNames('sup', OPTIONS.supervisors || []);
      el('stuName').placeholder = 'Start typing your name (' + NAMES.stu.length + ' on the list)';
      el('supName').placeholder = 'Start typing your name (' + NAMES.sup.length + ' on the list)';
    })
    .withFailureHandler(function (e) { err('Could not load the name lists: ' + fail(e)); })
    .getLoginOptions();

  var saved = sessionStorage.getItem('emw_token');
  if (!saved) return;
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.ok) { enter({ ok: true, token: saved, role: r.role, name: r.name }); }
      else { sessionStorage.removeItem('emw_token'); }
    })
    .withFailureHandler(function () {})
    .whoAmI(saved);
});

/* ---------------------------------------------------------------- logins */
function doStudent() {
  var n = exact('stu');
  if (!n) { err('Please pick your name from the suggestions as you type.'); el('stuName').focus(); return; }
  el('stuName').value = n;
  var e = el('stuEmail').value;
  el('stuBtn').disabled = true; el('stuBtn').textContent = 'Signing in…';
  google.script.run
    .withSuccessHandler(function (r) { el('stuBtn').disabled = false; el('stuBtn').textContent = 'Sign in'; enter(r); })
    .withFailureHandler(function (x) { el('stuBtn').disabled = false; el('stuBtn').textContent = 'Sign in'; err(fail(x)); })
    .loginStudent(n, e);
}

function doSupervisor() {
  var n = exact('sup');
  if (!n) { err('Please pick your name from the suggestions as you type.'); el('supName').focus(); return; }
  el('supName').value = n;
  var p = el('supPin').value;
  el('supBtn').disabled = true; el('supBtn').textContent = 'Signing in…';
  google.script.run
    .withSuccessHandler(function (r) { el('supBtn').disabled = false; el('supBtn').textContent = 'Sign in'; enter(r); })
    .withFailureHandler(function (x) { el('supBtn').disabled = false; el('supBtn').textContent = 'Sign in'; err(fail(x)); })
    .loginSupervisor(n, p);
}

function doAdmin() {
  var p = el('admPass').value;
  el('admBtn').disabled = true; el('admBtn').textContent = 'Signing in…';
  google.script.run
    .withSuccessHandler(function (r) { el('admBtn').disabled = false; el('admBtn').textContent = 'Sign in'; enter(r); })
    .withFailureHandler(function (x) { el('admBtn').disabled = false; el('admBtn').textContent = 'Sign in'; err(fail(x)); })
    .loginAdmin(p);
}

function enter(r) {
  if (!r || !r.ok) { err('Sign in did not complete.'); return; }
  TOKEN = r.token;
  sessionStorage.setItem('emw_token', TOKEN);
  clearMsgs();
  el('whoName').textContent = r.name;
  el('whoRole').textContent = r.role;
  show_('app');
  ['Student', 'Supervisor', 'Admin'].forEach(function (x) {
    el('view' + x).className = (x === r.role) ? '' : 'hidden';
  });
  if (r.role === 'Student')    { if (typeof stuEnter === 'function') { stuEnter(); } else { loadStudent(); } }
  if (r.role === 'Supervisor') { if (typeof supEnter === 'function') { supEnter(); } else { loadSupervisor(); } }
  if (r.role === 'Admin')      { if (typeof admEnter === 'function') { admEnter(); } else { loadAdmin(); } }
}

function signOut() {
  if (TOKEN) { google.script.run.withFailureHandler(function () {}).logoutSession(TOKEN); }
  TOKEN = null; sessionStorage.removeItem('emw_token');
  show_('login');
}

/* --------------------------------------------------------------- badges */
function badge(status) {
  var t = String(status || '').toUpperCase() || 'UNKNOWN';
  var c = 'muted';
  if (t.indexOf('ACTIVE') > -1) c = 'good';
  else if (t.indexOf('CAMPUS') > -1) c = 'info';
  else if (t.indexOf('ROTATION') > -1) c = 'warn';
  return '<span class="badge ' + c + '">' + esc(t) + '</span>';
}

/* --------------------------------------------------------------- loading */
function loadStudent() {
  google.script.run
    .withSuccessHandler(function (s) {
      if (!s) { problem('Your email is not in the trainee list. Please ask the admin.'); return; }
      el('sName').textContent = s.name || '-';
      el('sStatus').innerHTML = badge(s.status);
      el('sNo').textContent = s.no || '-';
      el('sProgram').textContent = s.program || '-';
      el('sPosting').textContent = s.posting || 'Not assigned';
      el('sSupervisor').textContent = s.supervisor || 'Not assigned';
    })
    .withFailureHandler(function (e) { problem('Could not load your record: ' + fail(e)); })
    .getMyStudentData(TOKEN);
}

function loadSupervisor() {
  google.script.run
    .withSuccessHandler(function (rows) {
      rows = rows || [];
      el('supCount').textContent = rows.length + ' student' + (rows.length === 1 ? '' : 's') + ' assigned to you.';
      el('supBody').innerHTML = rows.map(function (s) {
        return '<tr><td class="mono">' + esc(s.no || '-') + '</td><td><b>' + esc(s.name || '-') + '</b></td><td>' +
               esc(s.program || '-') + '</td><td>' + badge(s.status) + '</td><td>' + esc(s.posting || '-') + '</td></tr>';
      }).join('');
      el('supEmpty').textContent = rows.length ? '' : 'No trainees are currently listed under your name.';
    })
    .withFailureHandler(function (e) { problem('Could not load your students: ' + fail(e)); })
    .getMyAssignedStudents(TOKEN);
}

/* Enter submits from any field of the visible form */
function enterKey_(ev, role) {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  if (role === 'Student')    { doStudent(); }
  if (role === 'Supervisor') { doSupervisor(); }
  if (role === 'Admin')      { doAdmin(); }
}

function syncMmc() {
  var b = el('mmcBtn');
  b.disabled = true; b.textContent = 'Copying…';
  el('mmcMsg').textContent = '';
  google.script.run
    .withSuccessHandler(function (r) {
      b.disabled = false; b.textContent = 'Copy NSR numbers from the Staff Registry';
      if (!r || r.error) { el('mmcMsg').textContent = 'Failed: ' + ((r && r.error) || 'no result'); return; }
      var lines = ['Copied to the "' + (r.copyTab || 'Staff NSR') + '" tab in this spreadsheet (' +
                   (r.copyRows || 0) + ' supervisors), and ' + r.updated + ' row(s) updated in Users.'];
      if (r.matched && r.matched.length) {
        lines.push('', 'Matched in the staff registry:');
        r.matched.forEach(function (m) { lines.push('  ' + m); });
      }
      if (r.ambiguous && r.ambiguous.length) {
        lines.push('', 'Ambiguous — nothing written, tell the admin to check:');
        r.ambiguous.forEach(function (m) { lines.push('  ' + m); });
      }
      if (r.unmatched && r.unmatched.length) {
        lines.push('', 'Not found in the registry, so left as-is:');
        r.unmatched.forEach(function (m) { lines.push('  ' + m); });
      }
      lines.push('', 'Looked for these columns, in order: ' + r.sourceHeaders.join(', ') +
                 ' (registry tabs searched: ' + r.staffTabs.join(', ') + ')');
      el('mmcMsg').textContent = lines.join('\n');
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = 'Copy NSR numbers from the Staff Registry';
      el('mmcMsg').textContent = 'Failed: ' + fail(e);
    })
    .syncSupervisorMmcFromRegistry(TOKEN);
}

function applyMmc() {
  var b = el('applyBtn');
  b.disabled = true; b.textContent = 'Applying…';
  google.script.run
    .withSuccessHandler(function (r) {
      b.disabled = false; b.textContent = 'Apply the copied numbers to logins';
      if (!r || r.error) { el('mmcMsg').textContent = 'Failed: ' + ((r && r.error) || 'no result'); return; }
      var lines = ['Updated ' + r.applied + ' login(s) from the "' + (r.copyTab || 'Staff NSR') + '" tab.'];
      if (r.rows && r.rows.length) { lines.push(''); r.rows.forEach(function (x) { lines.push('  ' + x); }); }
      if (r.skipped && r.skipped.length) {
        lines.push('', 'Skipped (no matching row in Users):');
        r.skipped.forEach(function (x) { lines.push('  ' + x); });
      }
      if (!r.applied) { lines.push('', 'Nothing needed changing.'); }
      el('mmcMsg').textContent = lines.join('\n');
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = 'Apply the copied numbers to logins';
      el('mmcMsg').textContent = 'Failed: ' + fail(e);
    })
    .applyCopiedMmcToLogins(TOKEN);
}

function refreshPins() {
  var b = el('pinBtn');
  b.disabled = true; b.textContent = 'Working…';
  google.script.run
    .withSuccessHandler(function (r) {
      b.disabled = false; b.textContent = 'Refresh the supervisor / NSR list';
      el('pinMsg').textContent = (r && r.tab)
        ? 'Done — ' + r.supervisors + ' people in the "' + r.tab + '" tab' +
          (r.adminCreated ? ', and an admin passcode was created' : '') + '.'
        : 'Done.';
    })
    .withFailureHandler(function (e) {
      b.disabled = false; b.textContent = 'Refresh the supervisor / NSR list';
      el('pinMsg').textContent = 'Could not refresh: ' + fail(e);
    })
    .refreshReferenceTab(TOKEN);
}

function loadAdmin() {
  google.script.run
    .withSuccessHandler(function (rows) {
      rows = rows || [];
      if (!rows.length) { problem('No trainees were read from the sheet.'); }
      el('admBody').innerHTML = rows.map(function (s) {
        return '<tr><td class="mono">' + esc(s.no || '-') + '</td><td><b>' + esc(s.name || '-') + '</b></td><td>' +
               esc(s.email || '-') + '</td><td>' + esc(s.program || '-') + '</td><td>' + badge(s.status) +
               '</td><td>' + esc(s.posting || '-') + '</td><td>' + esc(s.supervisor || '-') + '</td></tr>';
      }).join('');
      el('admCount').textContent = rows.length + ' trainee' + (rows.length === 1 ? '' : 's') + ' in the list.';
    })
    .withFailureHandler(function (e) { problem('Could not load the list: ' + fail(e)); })
    .getAllStudents(TOKEN);

  // keep the supervisor reference tab current (the server rate-limits this)
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.tab) {
        el('pinMsg').textContent = 'Supervisor / NSR list refreshed in the "' + r.tab + '" tab (' +
          r.supervisors + ' rows' + (r.generated ? ', ' + r.generated + ' NSR number(s) issued' : '') + ').';
      }
    })
    .withFailureHandler(function () {})
    .refreshReferenceTab(TOKEN);

  google.script.run
    .withSuccessHandler(function (d) {
      if (!d) return;
      el('admDiag').textContent = 'sheet ' + (d.spreadsheetName || '?') + ' · trainee tab ' +
        (d.masterTabUsed || 'NOT FOUND') + ' · trainees ' + d.traineeCount +
        ' · roles tab ' + (d.usersTabUsed || 'NOT FOUND') + ' (' + d.usersRows + ' rows)';
    })
    .withFailureHandler(function () {})
    .getDiagnostics(TOKEN);
}

/* Shows which Google account the deployment can see (D1). Blank means the deployment
   still allows anyone in without signing in. */
google.script.run
  .withSuccessHandler(function (r) {
    var box = document.getElementById('gmailLine');
    if (!box) return;
    box.textContent = (r && r.email)
      ? 'Signed in to Google as ' + r.email
      : 'No Google sign-in detected - the deployment still allows anyone to open this page.';
  })
  .withFailureHandler(function () {})
  .getSignedInEmail();
</script>
</body>
